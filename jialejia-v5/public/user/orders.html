<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>查单 - 佳乐家</title>
  <link rel="stylesheet" href="../common.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* ===== 查单页面专属样式 ===== */
    .page-orders { padding-bottom: 80px; }

    /* 登录界面 */
    .login-wrap { padding: 40px 32px; }
    .login-title { font-size: 24px; font-weight: 700; text-align: center; margin-bottom: 8px; }
    .login-subtitle { font-size: 14px; color: var(--text-light); text-align: center; margin-bottom: 32px; }
    .login-form .form-group { margin-bottom: 20px; }
    .login-form .form-label { font-size: 14px; color: var(--text-secondary); margin-bottom: 6px; }
    .login-form .form-input { height: 48px; font-size: 16px; }
    .login-code-row { display: flex; gap: 12px; }
    .login-code-row .form-input { flex: 1; }
    .login-code-row .btn { flex-shrink: 0; height: 48px; border-radius: 8px; }
    .login-error { color: var(--danger); font-size: 13px; text-align: center; margin-top: 8px; display: none; }
    .login-btn { height: 50px; font-size: 16px; border-radius: 25px; width: 100%; margin-top: 12px; }

    /* 订单Tab */
    .order-tabs { display: flex; background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; }
    .order-tab { flex: 1; text-align: center; padding: 14px 0; font-size: 14px; color: var(--text-secondary); cursor: pointer; position: relative; transition: color 0.2s; }
    .order-tab.active { color: var(--primary); font-weight: 500; }
    .order-tab.active::after { content: ''; position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); width: 20px; height: 3px; background: var(--primary); border-radius: 2px; }

    /* 订单列表 */
    .order-list { padding: 12px 16px; }

    /* 状态标签颜色 */
    .tag-pending { background: #FFF7E6; color: var(--warning); }
    .tag-assigned, .tag-processing { background: var(--primary-light); color: var(--primary); }
    .tag-completed { background: #F6FFED; color: var(--success); }
    .tag-cancelled { background: #FFF2F0; color: var(--danger); }

    /* 订单详情弹窗 */
    .detail-section { margin-bottom: 16px; }
    .detail-section-title { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 10px; display: flex; align-items: center; }
    .detail-section-title i { margin-right: 6px; color: var(--primary); }
    .detail-row { display: flex; padding: 6px 0; font-size: 13px; }
    .detail-row .label { color: var(--text-light); width: 80px; flex-shrink: 0; }
    .detail-row .value { color: var(--text); flex: 1; }

    /* 时间线 */
    .timeline { position: relative; padding-left: 20px; }
    .timeline::before { content: ''; position: absolute; left: 6px; top: 4px; bottom: 4px; width: 2px; background: var(--border); }
    .timeline-item { position: relative; padding-bottom: 16px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before { content: ''; position: absolute; left: -16px; top: 4px; width: 10px; height: 10px; border-radius: 50%; background: var(--border); }
    .timeline-item.active::before { background: var(--primary); }
    .timeline-item .tl-time { font-size: 12px; color: var(--text-light); margin-bottom: 2px; }
    .timeline-item .tl-text { font-size: 13px; color: var(--text); }

    /* 评价星级 */
    .star-group { display: flex; gap: 24px; flex-wrap: wrap; margin-bottom: 16px; }
    .star-item { text-align: center; }
    .star-item .label { font-size: 12px; color: var(--text-secondary); margin-bottom: 6px; }
    .star-item .stars { display: flex; gap: 4px; }
    .star-item .stars i { font-size: 22px; color: #ddd; cursor: pointer; transition: color 0.15s; }
    .star-item .stars i.active { color: #FAAD14; }

    /* 底部操作栏 */
    .detail-actions { display: flex; gap: 10px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--border); }
    .detail-actions .btn { flex: 1; height: 40px; font-size: 13px; border-radius: 20px; }

    /* 师傅信息 */
    .tech-info { display: flex; align-items: center; gap: 12px; padding: 12px; background: #FAFAFA; border-radius: 8px; margin-top: 8px; }
    .tech-info .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--primary-light); display: flex; align-items: center; justify-content: center; color: var(--primary); font-size: 20px; }
    .tech-info .tech-detail { flex: 1; }
    .tech-info .tech-detail .name { font-size: 14px; font-weight: 500; }
    .tech-info .tech-detail .phone { font-size: 13px; color: var(--primary); }
    .tech-info .tech-detail .phone a { color: var(--primary); text-decoration: none; }

    /* 评价文字 */
    .evaluate-text { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 13px; resize: none; min-height: 80px; }

    /* 空状态 */
    .empty-state { padding: 80px 20px; text-align: center; color: var(--text-light); }
    .empty-state i { font-size: 48px; margin-bottom: 12px; display: block; color: #ddd; }
  </style>
</head>
<body>
  <div class="page page-orders">

    <!-- 顶部导航 -->
    <div class="header">
      <div class="title">我的订单</div>
    </div>

    <!-- ===== 登录界面 ===== -->
    <div id="loginSection" style="display:none;">
      <div class="login-wrap">
        <div class="login-title">欢迎回来</div>
        <div class="login-subtitle">登录后查看您的订单信息</div>
        <div class="login-form">
          <div class="form-group">
            <label class="form-label">手机号</label>
            <input type="tel" class="form-input" id="loginPhone" placeholder="请输入11位手机号" maxlength="11">
          </div>
          <div class="form-group">
            <label class="form-label">验证码</label>
            <div class="login-code-row">
              <input type="text" class="form-input" id="loginCode" placeholder="请输入验证码" maxlength="4" inputmode="numeric">
              <button class="btn btn-outline" id="sendCodeBtn" style="white-space:nowrap;">获取验证码</button>
            </div>
          </div>
          <div class="login-error" id="loginError"></div>
          <button class="btn btn-primary login-btn" id="loginBtn">登录</button>
        </div>
      </div>
    </div>

    <!-- ===== 订单内容 ===== -->
    <div id="orderSection" style="display:none;">
      <!-- 订单Tab -->
      <div class="order-tabs" id="orderTabs">
        <span class="order-tab active" data-status="">全部</span>
        <span class="order-tab" data-status="pending">待接单</span>
        <span class="order-tab" data-status="processing">进行中</span>
        <span class="order-tab" data-status="completed">已完成</span>
        <span class="order-tab" data-status="cancelled">已取消</span>
      </div>

      <!-- 订单列表 -->
      <div class="order-list" id="orderList"></div>
    </div>
  </div>

  <!-- ===== 订单详情弹窗 ===== -->
  <div class="modal-overlay" id="detailModal" style="display:none;">
    <div class="modal-content" style="max-width:500px;">
      <div class="modal-title" id="detailTitle">订单详情</div>
      <div id="detailBody" style="max-height:60vh;overflow-y:auto;"></div>
      <div class="modal-actions" id="detailActions" style="flex-wrap:wrap;"></div>
    </div>
  </div>

  <!-- ===== 评价弹窗 ===== -->
  <div class="modal-overlay" id="evaluateModal" style="display:none;">
    <div class="modal-content" style="max-width:450px;">
      <div class="modal-title">评价服务</div>
      <div id="evaluateBody">
        <div class="star-group" id="starGroup"></div>
        <textarea class="evaluate-text" id="evaluateText" placeholder="说说您的体验（选填）"></textarea>
      </div>
      <div class="modal-actions">
        <button class="btn btn-outline" id="cancelEvaluateBtn">取消</button>
        <button class="btn btn-primary" id="submitEvaluateBtn">提交评价</button>
      </div>
    </div>
  </div>

  <script src="../common.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      // ===== DOM 引用 =====
      const $ = id => document.getElementById(id);
      const loginSection = $('loginSection');
      const orderSection = $('orderSection');
      const loginPhone = $('loginPhone');
      const loginCode = $('loginCode');
      const sendCodeBtn = $('sendCodeBtn');
      const loginBtn = $('loginBtn');
      const loginError = $('loginError');
      const orderTabs = $('orderTabs');
      const orderList = $('orderList');
      const detailModal = $('detailModal');
      const detailTitle = $('detailTitle');
      const detailBody = $('detailBody');
      const detailActions = $('detailActions');
      const evaluateModal = $('evaluateModal');
      const starGroup = $('starGroup');
      const evaluateText = $('evaluateText');
      const submitEvaluateBtn = $('submitEvaluateBtn');
      const cancelEvaluateBtn = $('cancelEvaluateBtn');

      // ===== TabBar =====
      function renderTabbar() {
        const tabbar = document.createElement('div');
        tabbar.className = 'tabbar';
        tabbar.innerHTML = `
          <div class="tabbar-item" onclick="Utils.go('booking.html')">
            <i class="fas fa-calendar-check icon"></i>
            <span class="label">预约</span>
          </div>
          <div class="tabbar-item active" onclick="Utils.go('orders.html')">
            <i class="fas fa-clipboard-list icon"></i>
            <span class="label">查单</span>
          </div>
          <div class="tabbar-item" onclick="Utils.go('profile.html')">
            <i class="fas fa-user icon"></i>
            <span class="label">我的</span>
          </div>
        `;
        document.body.appendChild(tabbar);
      }
      renderTabbar();

      // ===== 状态 =====
      let currentStatus = '';
      let orders = [];
      let currentOrderNo = '';
      let countdown = 0;
      let countdownTimer = null;

      // ===== 登录逻辑 =====
      function checkLogin() {
        const token = Utils.get('token');
        if (token) {
          loginSection.style.display = 'none';
          orderSection.style.display = 'block';
          loadOrders();
        } else {
          loginSection.style.display = 'block';
          orderSection.style.display = 'none';
        }
      }

      // 发送验证码
      sendCodeBtn.addEventListener('click', async function() {
        const phone = loginPhone.value.trim();
        if (!Utils.isValidPhone(phone)) {
          Utils.toast('请输入正确的手机号');
          return;
        }
        this.disabled = true;
        const res = await API.sendCode(phone);
        if (res.code === 200 || res.code === 201) {
          Utils.success('验证码已发送');
          startCountdown();
        } else {
          this.disabled = false;
          Utils.error(res.message || '发送失败');
        }
      });

      function startCountdown() {
        countdown = 60;
        sendCodeBtn.disabled = true;
        countdownTimer = setInterval(() => {
          countdown--;
          sendCodeBtn.textContent = countdown + 's';
          if (countdown <= 0) {
            clearInterval(countdownTimer);
            sendCodeBtn.disabled = false;
            sendCodeBtn.textContent = '获取验证码';
          }
        }, 1000);
      }

      // 登录
      loginBtn.addEventListener('click', async function() {
        const phone = loginPhone.value.trim();
        const code = loginCode.value.trim();
        if (!Utils.isValidPhone(phone)) {
          Utils.toast('请输入正确的手机号');
          return;
        }
        if (!code || code.length !== 4) {
          Utils.toast('请输入4位验证码');
          return;
        }
        this.disabled = true;
        this.textContent = '登录中...';
        loginError.style.display = 'none';
        const res = await API.login(phone, code);
        this.disabled = false;
        this.textContent = '登录';
        if (res.code === 200 || res.code === 201) {
          const token = res.data?.token || res.data?.access_token || '';
          if (token) {
            Utils.set('token', token);
            API.token = token;
            if (res.data.user || res.data.user_info) {
              Utils.setJSON('userInfo', res.data.user || res.data.user_info);
            }
            Utils.success('登录成功');
            checkLogin();
          } else {
            Utils.error('登录异常，请重试');
          }
        } else {
          loginError.textContent = res.message || '登录失败';
          loginError.style.display = 'block';
        }
      });

      // 手机号输入限制
      loginPhone.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
      });
      loginCode.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '');
      });

      // ===== 订单Tab切换 =====
      orderTabs.querySelectorAll('.order-tab').forEach(tab => {
        tab.addEventListener('click', function() {
          orderTabs.querySelectorAll('.order-tab').forEach(t => t.classList.remove('active'));
          this.classList.add('active');
          currentStatus = this.dataset.status;
          loadOrders();
        });
      });

      // ===== 加载订单列表 =====
      async function loadOrders() {
        orderList.innerHTML = '<div class="loading" style="padding:60px 0;">加载中</div>';
        const params = currentStatus ? { status: currentStatus } : {};
        const res = await API.getOrders(params);
        if (res.code === 200 && res.data) {
          orders = Array.isArray(res.data) ? res.data : (res.data.list || []);
          renderOrders();
        } else {
          orders = [];
          renderOrders();
        }
      }

      function renderOrders() {
        if (orders.length === 0) {
          orderList.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-inbox"></i>
              <span class="text">暂无订单</span>
            </div>`;
          return;
        }
        orderList.innerHTML = orders.map(o => {
          const statusText = Utils.getStatusText(o.status);
          const statusClass = Utils.getStatusClass(o.status);
          return `
            <div class="order-card" data-no="${o.order_no || o.id}">
              <div class="order-header">
                <span class="order-no">订单号：${o.order_no || o.id}</span>
                <span class="tag ${statusClass}">${statusText}</span>
              </div>
              <div class="order-service">${o.service_name || o.service_name}</div>
              <div class="order-info">
                <span><i class="far fa-calendar-alt"></i> ${o.appointment_date || ''} ${o.appointment_time || ''}</span>
                <span><i class="fas fa-map-marker-alt"></i> ${o.street || ''} ${o.address_detail || ''}</span>
              </div>
              ${o.technician_name ? `
              <div class="order-footer">
                <span>师傅：${o.technician_name} ${o.technician_phone ? Utils.maskPhone(o.technician_phone) : ''}</span>
              </div>` : `
              <div class="order-footer">
                <span style="color:var(--text-light);font-size:12px;">等待师傅接单...</span>
              </div>`}
            </div>`;
        }).join('');

        // 点击卡片展开详情
        orderList.querySelectorAll('.order-card').forEach(card => {
          card.addEventListener('click', function() {
            const no = this.dataset.no;
            showOrderDetail(no);
          });
        });
      }

      // ===== 订单详情 =====
      async function showOrderDetail(no) {
        currentOrderNo = no;
        detailModal.style.display = 'flex';
        detailBody.innerHTML = '<div class="loading">加载中</div>';
        detailActions.innerHTML = '';
        detailTitle.textContent = '订单详情';

        const res = await API.getOrderDetail(no);
        if (res.code !== 200 || !res.data) {
          detailBody.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">订单不存在</div>';
          return;
        }

        const order = res.data;
        const statusText = Utils.getStatusText(order.status);
        const statusClass = Utils.getStatusClass(order.status);
        const logs = order.order_logs || [];

        let html = `
          <div style="text-align:center;margin-bottom:16px;">
            <span class="tag ${statusClass}" style="font-size:14px;padding:4px 16px;">${statusText}</span>
          </div>

          <div class="detail-section">
            <div class="detail-section-title"><i class="fas fa-stream"></i>订单进度</div>
            <div class="timeline">
              ${logs.length > 0 ? logs.map((log, idx) => `
                <div class="timeline-item${idx === logs.length - 1 ? ' active' : ''}">
                  <div class="tl-time">${Utils.formatTime(log.created_at || log.time)}</div>
                  <div class="tl-text">${log.content || log.action || log.status}</div>
                </div>
              `).join('') : `
                <div class="timeline-item active">
                  <div class="tl-time">${Utils.formatTime(order.created_at)}</div>
                  <div class="tl-text">订单已创建</div>
                </div>
              `}
            </div>
          </div>

          <div class="detail-section">
            <div class="detail-section-title"><i class="fas fa-info-circle"></i>服务信息</div>
            <div class="detail-row"><span class="label">订单编号</span><span class="value">${order.order_no || order.id}</span></div>
            <div class="detail-row"><span class="label">服务项目</span><span class="value">${order.service_name || order.service_name}</span></div>
            <div class="detail-row"><span class="label">预约时间</span><span class="value">${order.appointment_date || ''} ${order.appointment_time || ''}</span></div>
            <div class="detail-row"><span class="label">服务地址</span><span class="value">${order.street || ''} ${order.address_detail || ''}</span></div>
            <div class="detail-row"><span class="label">联系人</span><span class="value">${order.contact_name || ''} ${order.contact_phone ? Utils.maskPhone(order.contact_phone) : ''}</span></div>
            ${order.remark ? `<div class="detail-row"><span class="label">备注</span><span class="value">${order.remark}</span></div>` : ''}
            <div class="detail-row"><span class="label">订单金额</span><span class="value" style="color:var(--danger);font-weight:600;">${Utils.formatMoney(order.price)}</span></div>
          </div>`;

        // 师傅信息
        if (order.technician_name) {
          html += `
            <div class="detail-section">
              <div class="detail-section-title"><i class="fas fa-user-tie"></i>师傅信息</div>
              <div class="tech-info">
                <div class="avatar"><i class="fas fa-user"></i></div>
                <div class="tech-detail">
                  <div class="name">${order.technician_name}</div>
                  <div class="phone"><a href="tel:${order.technician_phone}"><i class="fas fa-phone"></i> ${order.technician_phone}</a></div>
                </div>
              </div>
            </div>`;
        }

        // 评价信息（已完成且已评价）
        if (order.evaluation) {
          html += `
            <div class="detail-section">
              <div class="detail-section-title"><i class="fas fa-star"></i>我的评价</div>
              <div class="detail-row">
                <span class="label">服务态度</span>
                <span class="value">${'★'.repeat(order.evaluation.attitude || 0)}${'☆'.repeat(5 - (order.evaluation.attitude || 0))}</span>
              </div>
              <div class="detail-row">
                <span class="label">技术水平</span>
                <span class="value">${'★'.repeat(order.evaluation.technology || 0)}${'☆'.repeat(5 - (order.evaluation.technology || 0))}</span>
              </div>
              <div class="detail-row">
                <span class="label">准时度</span>
                <span class="value">${'★'.repeat(order.evaluation.punctuality || 0)}${'☆'.repeat(5 - (order.evaluation.punctuality || 0))}</span>
              </div>
              ${order.evaluation.content ? `<div class="detail-row"><span class="label">评价</span><span class="value">${order.evaluation.content}</span></div>` : ''}
            </div>`;
        }

        detailBody.innerHTML = html;

        // 底部操作按钮
        let actionsHtml = '';
        const status = order.status;
        if (status === 'pending' || status === 'assigned') {
          actionsHtml += `<button class="btn btn-outline" id="cancelOrderBtn" style="flex:1;">取消订单</button>`;
        }
        if (order.technician_phone) {
          actionsHtml += `<a href="tel:${order.technician_phone}" class="btn btn-primary" style="flex:1;display:inline-flex;align-items:center;justify-content:center;text-decoration:none;">联系师傅</a>`;
        }
        if (status === 'completed') {
          if (!order.evaluation) {
            actionsHtml += `<button class="btn btn-primary" id="evaluateOrderBtn" style="flex:1;">评价师傅</button>`;
          }
          actionsHtml += `<button class="btn btn-outline" id="rebookBtn" style="flex:1;" onclick="Utils.go('booking.html')">再次预约</button>`;
        }
        detailActions.innerHTML = actionsHtml;

        // 绑定事件
        document.getElementById('cancelOrderBtn')?.addEventListener('click', async function() {
          Utils.confirm('取消订单', '确定要取消此订单吗？', async () => {
            const res2 = await API.cancelOrder(no);
            if (res2.code === 200 || res2.code === 201) {
              Utils.success('订单已取消');
              detailModal.style.display = 'none';
              loadOrders();
            } else {
              Utils.error(res2.message || '取消失败');
            }
          });
        });

        document.getElementById('evaluateOrderBtn')?.addEventListener('click', function() {
          detailModal.style.display = 'none';
          showEvaluateModal(no);
        });

        document.getElementById('rebookBtn')?.addEventListener('click', function() {
          detailModal.style.display = 'none';
        });
      }

      // ===== 评价 =====
      const evaluateDimensions = [
        { key: 'attitude', label: '服务态度' },
        { key: 'technology', label: '技术水平' },
        { key: 'punctuality', label: '准时度' }
      ];
      let evaluateScores = { attitude: 0, technology: 0, punctuality: 0 };
      let evaluateOrderNo = '';

      function showEvaluateModal(no) {
        evaluateOrderNo = no;
        evaluateScores = { attitude: 0, technology: 0, punctuality: 0 };
        evaluateText.value = '';
        renderStars();
        evaluateModal.style.display = 'flex';
      }

      function renderStars() {
        starGroup.innerHTML = evaluateDimensions.map(dim => `
          <div class="star-item">
            <div class="label">${dim.label}</div>
            <div class="stars" data-key="${dim.key}">
              ${[1,2,3,4,5].map(s => `<i class="fas fa-star${s <= evaluateScores[dim.key] ? ' active' : ''}" data-score="${s}"></i>`).join('')}
            </div>
          </div>
        `).join('');

        starGroup.querySelectorAll('.stars i').forEach(star => {
          star.addEventListener('click', function() {
            const key = this.closest('.stars').dataset.key;
            const score = parseInt(this.dataset.score);
            evaluateScores[key] = score;
            renderStars();
          });
        });
      }

      submitEvaluateBtn.addEventListener('click', async function() {
        const no = evaluateOrderNo;
        if (!evaluateScores.attitude || !evaluateScores.technology || !evaluateScores.punctuality) {
          Utils.toast('请完成所有维度的评分');
          return;
        }
        this.disabled = true;
        this.textContent = '提交中...';
        const res = await API.evaluateOrder(no, {
          attitude: evaluateScores.attitude,
          technology: evaluateScores.technology,
          punctuality: evaluateScores.punctuality,
          content: evaluateText.value.trim()
        });
        this.disabled = false;
        this.textContent = '提交评价';
        if (res.code === 200 || res.code === 201) {
          Utils.success('评价成功');
          evaluateModal.style.display = 'none';
          loadOrders();
        } else {
          Utils.error(res.message || '评价失败');
        }
      });

      cancelEvaluateBtn.addEventListener('click', function() {
        evaluateModal.style.display = 'none';
      });

      // ===== 模态框关闭 =====
      detailModal.addEventListener('click', function(e) {
        if (e.target === this) this.style.display = 'none';
      });
      evaluateModal.addEventListener('click', function(e) {
        if (e.target === this) this.style.display = 'none';
      });

      // ===== 初始化 =====
      checkLogin();
    });
  </script>
</body>
</html>
