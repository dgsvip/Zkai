<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>佳乐家 - 平台首页</title>
  <link rel="stylesheet" href="common.css">
  <style>
    .home-page { max-width: 750px; margin: 0 auto; min-height: 100vh; background: linear-gradient(180deg, #E6F4FF 0%, #F5F5F5 100%); padding-bottom: 40px; }
    .hero { text-align: center; padding: 60px 20px 40px; }
    .hero-logo { width: 80px; height: 80px; border-radius: 20px; background: linear-gradient(135deg, #1677FF, #4096FF); display: flex; align-items: center; justify-content: center; margin: 0 auto 16px; box-shadow: 0 8px 24px rgba(22,119,255,0.3); }
    .hero-logo span { font-size: 36px; color: #fff; font-weight: 700; }
    .hero h1 { font-size: 28px; font-weight: 700; color: #1a1a1a; margin-bottom: 6px; }
    .hero .subtitle { font-size: 14px; color: #666; margin-bottom: 4px; }
    .hero .region { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; color: #1677FF; background: #E6F4FF; padding: 4px 14px; border-radius: 20px; margin-top: 8px; }
    .entries { padding: 0 20px; margin-top: 20px; }
    .entry-card { display: flex; align-items: center; background: #fff; border-radius: 16px; padding: 20px; margin-bottom: 14px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); cursor: pointer; transition: transform 0.2s; }
    .entry-card:active { transform: scale(0.98); }
    .entry-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; color: #fff; flex-shrink: 0; }
    .entry-icon.user { background: linear-gradient(135deg, #1677FF, #4096FF); }
    .entry-icon.tech { background: linear-gradient(135deg, #52C41A, #73D13D); }
    .entry-icon.merchant { background: linear-gradient(135deg, #FA8C16, #FFA940); }
    .entry-info { flex: 1; margin-left: 16px; }
    .entry-info h3 { font-size: 16px; font-weight: 600; color: #1a1a1a; margin-bottom: 4px; }
    .entry-info p { font-size: 13px; color: #999; }
    .entry-arrow { font-size: 18px; color: #ccc; }
    .intro { text-align: center; padding: 40px 20px 20px; }
    .intro h2 { font-size: 16px; font-weight: 600; color: #333; margin-bottom: 12px; }
    .intro p { font-size: 13px; color: #999; line-height: 1.8; max-width: 600px; margin: 0 auto; }
    .intro .features { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 24px; }
    .intro .feature-item { background: #fff; border-radius: 12px; padding: 16px 8px; box-shadow: 0 1px 6px rgba(0,0,0,0.04); }
    .intro .feature-item .fi-icon { font-size: 28px; margin-bottom: 6px; display: block; }
    .intro .feature-item .fi-label { font-size: 12px; color: #666; }
    .footer-text { text-align: center; padding: 20px; font-size: 12px; color: #bbb; }
  </style>
</head>
<body>
  <div class="home-page">
    <div class="hero">
      <div class="hero-logo"><span>佳</span></div>
      <h1>佳乐家</h1>
      <p class="subtitle">专业家庭服务 · 品质生活管家</p>
      <div class="region">📍 山东省菏泽市曹县</div>
    </div>

    <div class="entries">
      <div class="entry-card" onclick="Utils.go('/user/booking.html')">
        <div class="entry-icon user">👤</div>
        <div class="entry-info">
          <h3>用户入口</h3>
          <p>预约服务 · 查看订单 · 在线评价</p>
        </div>
        <div class="entry-arrow">›</div>
      </div>

      <div class="entry-card" onclick="Utils.go('/technician/index.html')">
        <div class="entry-icon tech">🔧</div>
        <div class="entry-info">
          <h3>师傅入口</h3>
          <p>接单管理 · 服务记录 · 收益查看</p>
        </div>
        <div class="entry-arrow">›</div>
      </div>

      <div class="entry-card" onclick="Utils.go('/merchant/promote.html')">
        <div class="entry-icon merchant">🏪</div>
        <div class="entry-info">
          <h3>商家入口</h3>
          <p>推广管理 · 代报订单 · 收益结算</p>
        </div>
        <div class="entry-arrow">›</div>
      </div>
    </div>

    <div class="intro">
      <h2>关于佳乐家</h2>
      <p>佳乐家是曹县本地专业家庭生活服务平台，致力于为居民提供便捷、可靠的家电维修、水电安装、家居清洁等一站式家庭服务。平台汇聚本地专业师傅，严格审核、持证上岗，让您足不出户，轻松解决家庭烦恼。</p>
      <div class="features">
        <div class="feature-item">
          <span class="fi-icon">🔒</span>
          <span class="fi-label">实名认证</span>
        </div>
        <div class="feature-item">
          <span class="fi-icon">⚡</span>
          <span class="fi-label">快速响应</span>
        </div>
        <div class="feature-item">
          <span class="fi-icon">🛡️</span>
          <span class="fi-label">售后保障</span>
        </div>
      </div>
    </div>

    <div class="footer-text">© 2024 佳乐家 版权所有</div>
  </div>
</body>
</html>
