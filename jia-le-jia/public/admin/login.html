<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佳乐家 - 管理员登录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; height: 100vh; display: flex; align-items: center; justify-content: center; }
.login-wrapper { display: flex; width: 900px; min-height: 500px; background: #fff; border-radius: 12px; box-shadow: 0 8px 40px rgba(0,0,0,0.08); overflow: hidden; }
.login-left { flex: 1; background: linear-gradient(135deg, #1677FF 0%, #0958d9 100%); padding: 60px 40px; display: flex; flex-direction: column; justify-content: center; color: #fff; }
.login-left h1 { font-size: 32px; margin-bottom: 12px; }
.login-left p { font-size: 15px; opacity: 0.85; line-height: 1.6; }
.login-left .brand { font-size: 48px; margin-bottom: 20px; }
.login-right { flex: 1; padding: 60px 48px; display: flex; flex-direction: column; justify-content: center; }
.login-right h2 { font-size: 24px; color: #1a1a1a; margin-bottom: 8px; }
.login-right .subtitle { color: #8c8c8c; font-size: 14px; margin-bottom: 32px; }
.form-group { margin-bottom: 20px; }
.form-group label { display: block; font-size: 14px; color: #333; margin-bottom: 6px; font-weight: 500; }
.form-group input { width: 100%; height: 42px; border: 1px solid #d9d9d9; border-radius: 6px; padding: 0 12px; font-size: 14px; outline: none; transition: border-color 0.3s; }
.form-group input:focus { border-color: #1677FF; box-shadow: 0 0 0 2px rgba(22,119,255,0.1); }
.captcha-row { display: flex; gap: 12px; }
.captcha-row input { flex: 1; }
.captcha-box { width: 100px; height: 42px; background: #f5f5f5; border: 1px solid #d9d9d9; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: bold; color: #1677FF; cursor: pointer; user-select: none; }
.error-msg { color: #ff4d4f; font-size: 13px; margin-top: 4px; min-height: 20px; }
.login-btn { width: 100%; height: 44px; background: #1677FF; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; margin-top: 8px; transition: background 0.3s; }
.login-btn:hover { background: #0958d9; }
.login-btn:disabled { background: #a0c5ff; cursor: not-allowed; }
</style>
</head>
<body>
<div class="login-wrapper">
  <div class="login-left">
    <div class="brand">🔧</div>
    <h1>佳乐家</h1>
    <p>家电服务预约平台 · 后台管理系统</p>
    <p style="margin-top:8px;font-size:13px;opacity:0.7">JiaLeJia Home Appliance Service Platform</p>
  </div>
  <div class="login-right">
    <h2>管理员登录</h2>
    <p class="subtitle">请输入您的账号和密码</p>
    <div class="form-group">
      <label>账号</label>
      <input type="text" id="account" placeholder="请输入账号" value="admin">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input type="password" id="password" placeholder="请输入密码" value="admin123">
    </div>
    <div class="form-group">
      <label>验证码</label>
      <div class="captcha-row">
        <input type="text" id="captcha" placeholder="输入计算结果" maxlength="3">
        <div class="captcha-box" id="captchaBox" onclick="refreshCaptcha()"></div>
      </div>
    </div>
    <div class="error-msg" id="errorMsg"></div>
    <button class="login-btn" id="loginBtn" onclick="handleLogin()">登 录</button>
  </div>
</div>
<script>
let captchaResult = 0;

function refreshCaptcha() {
  const a = Math.floor(Math.random() * 9) + 1;
  const b = Math.floor(Math.random() * 9) + 1;
  captchaResult = a + b;
  document.getElementById('captchaBox').textContent = a + ' + ' + b + ' = ?';
}

function handleLogin() {
  const account = document.getElementById('account').value.trim();
  const password = document.getElementById('password').value.trim();
  const captcha = document.getElementById('captcha').value.trim();
  const errorEl = document.getElementById('errorMsg');
  const btn = document.getElementById('loginBtn');

  if (!account || !password) {
    errorEl.textContent = '请输入账号和密码';
    return;
  }
  if (parseInt(captcha) !== captchaResult) {
    errorEl.textContent = '验证码错误';
    refreshCaptcha();
    document.getElementById('captcha').value = '';
    return;
  }

  errorEl.textContent = '';
  btn.disabled = true;
  btn.textContent = '登录中...';

  fetch('/api/admin/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ account, password })
  })
  .then(r => r.json())
  .then(res => {
    if (res.code === 0 || res.token) {
      const token = res.token || res.data?.token;
      if (token) localStorage.setItem('admin_token', token);
      window.location.href = 'dashboard.html';
    } else {
      errorEl.textContent = res.message || '登录失败，请检查账号密码';
      refreshCaptcha();
      document.getElementById('captcha').value = '';
    }
  })
  .catch(() => {
    errorEl.textContent = '网络错误，请稍后重试';
    refreshCaptcha();
    document.getElementById('captcha').value = '';
  })
  .finally(() => {
    btn.disabled = false;
    btn.textContent = '登 录';
  });
}

document.getElementById('captcha').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') handleLogin();
});

refreshCaptcha();
</script>
</body>
</html>
