<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>佳乐家 - 公告管理</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:#f0f2f5; display:flex; min-height:100vh; }
:root { --primary:#1677FF; --primary-hover:#0958d9; --sidebar-w:220px; --header-h:56px; }
.sidebar { width:var(--sidebar-w); background:#001529; color:#fff; position:fixed; top:0; left:0; bottom:0; display:flex; flex-direction:column; z-index:100; }
.sidebar-logo { height:var(--header-h); display:flex; align-items:center; padding:0 20px; font-size:18px; font-weight:600; border-bottom:1px solid rgba(255,255,255,0.08); }
.sidebar-logo span { margin-left:10px; }
.sidebar-menu { flex:1; padding:12px 0; overflow-y:auto; }
.menu-item { display:flex; align-items:center; padding:12px 24px; color:rgba(255,255,255,0.65); text-decoration:none; font-size:14px; transition:all .2s; cursor:pointer; }
.menu-item:hover { color:#fff; background:rgba(255,255,255,0.05); }
.menu-item.active { color:#fff; background:var(--primary); }
.menu-item .icon { margin-right:10px; font-size:16px; }
.main { margin-left:var(--sidebar-w); flex:1; min-height:100vh; }
.header { height:var(--header-h); background:#fff; display:flex; align-items:center; justify-content:space-between; padding:0 24px; border-bottom:1px solid #e8e8e8; position:sticky; top:0; z-index:50; }
.header h2 { font-size:18px; color:#1a1a1a; }
.header-right { display:flex; align-items:center; gap:16px; }
.logout-btn { padding:6px 16px; background:#fff; border:1px solid #d9d9d9; border-radius:4px; cursor:pointer; font-size:13px; color:#666; }
.logout-btn:hover { color:var(--primary); border-color:var(--primary); }
.content { padding:20px; }
.filter-row { display:flex; gap:12px; align-items:center; margin-bottom:16px; flex-wrap:wrap; }
.filter-btn { padding:0 16px; height:34px; background:var(--primary); color:#fff; border:none; border-radius:4px; cursor:pointer; font-size:13px; }
.filter-btn:hover { background:var(--primary-hover); }
.filter-btn.outline { background:#fff; color:var(--primary); border:1px solid var(--primary); }
.filter-btn.outline:hover { background:#f0f7ff; }
.filter-btn.green { background:#52c41a; }
.filter-btn.green:hover { background:#73d13d; }
.table-container { background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 4px rgba(0,0,0,0.04); }
table { width:100%; border-collapse:collapse; }
table th, table td { padding:10px 12px; text-align:left; border-bottom:1px solid #f0f0f0; font-size:13px; }
table th { color:#8c8c8c; font-weight:500; background:#fafafa; white-space:nowrap; }
table td { color:#333; }
table tr:hover td { background:#fafafa; }
.action-link { color:var(--primary); cursor:pointer; font-size:12px; margin-right:8px; }
.action-link:hover { text-decoration:underline; }
.action-link.danger { color:#ff4d4f; }
.modal-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.45); z-index:1000; justify-content:center; align-items:center; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border-radius:8px; width:640px; max-height:80vh; overflow-y:auto; box-shadow:0 8px 40px rgba(0,0,0,0.12); }
.modal-sm { width:520px; }
.modal-header { padding:16px 24px; border-bottom:1px solid #f0f0f0; display:flex; justify-content:space-between; align-items:center; }
.modal-header h3 { font-size:16px; }
.modal-close { background:none; border:none; font-size:20px; cursor:pointer; color:#999; }
.modal-body { padding:24px; }
.modal-footer { padding:12px 24px; border-top:1px solid #f0f0f0; display:flex; justify-content:flex-end; gap:8px; }
.modal-footer button { padding:6px 16px; border-radius:4px; cursor:pointer; font-size:13px; }
.btn-primary { background:var(--primary); color:#fff; border:none; }
.btn-primary:hover { background:var(--primary-hover); }
.btn-default { background:#fff; border:1px solid #d9d9d9; color:#333; }
.btn-default:hover { border-color:var(--primary); color:var(--primary); }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:13px; color:#333; margin-bottom:4px; font-weight:500; }
.form-group input, .form-group select, .form-group textarea { width:100%; height:34px; border:1px solid #d9d9d9; border-radius:4px; padding:0 10px; font-size:13px; outline:none; }
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color:var(--primary); }
.form-group textarea { height:120px; padding:8px 10px; resize:vertical; }
.form-row { display:flex; gap:12px; }
.form-row .form-group { flex:1; }
</style>
</head>
<body>
<div class="sidebar">
  <div class="sidebar-logo"><span>🔧</span> 佳乐家管理</div>
  <div class="sidebar-menu">
    <a class="menu-item" href="dashboard.html"><span class="icon">📊</span>仪表盘</a>
    <a class="menu-item" href="orders.html"><span class="icon">📦</span>订单管理</a>
    <a class="menu-item" href="technicians.html"><span class="icon">👨‍🔧</span>师傅管理</a>
    <a class="menu-item" href="merchants.html"><span class="icon">🏪</span>商家管理</a>
    <a class="menu-item" href="services.html"><span class="icon">🛠️</span>服务管理</a>
    <a class="menu-item active" href="announcements.html"><span class="icon">📢</span>公告管理</a>
    <a class="menu-item" href="dataview.html"><span class="icon">📊</span>数据大屏</a>
    <a class="menu-item" href="settings.html"><span class="icon">⚙️</span>系统设置</a>
  </div>
</div>
<div class="main">
  <div class="header">
    <h2>公告管理</h2>
    <div class="header-right">
      <span style="font-size:14px;color:#666;">管理员</span>
      <button class="logout-btn" onclick="localStorage.removeItem('admin_token');window.location.href='login.html'">退出登录</button>
    </div>
  </div>
  <div class="content">
    <div class="filter-row">
      <button class="filter-btn green" onclick="openAddModal()">📢 发布公告</button>
    </div>
    <div class="table-container">
      <table>
        <thead><tr><th>标题</th><th>目标</th><th>置顶</th><th>发布时间</th><th>状态</th><th>操作</th></tr></thead>
        <tbody id="announcementTableBody"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="formModal">
  <div class="modal modal-sm">
    <div class="modal-header"><h3 id="formTitle">发布公告</h3><button class="modal-close" onclick="closeModal('formModal')">&times;</button></div>
    <div class="modal-body">
      <div class="form-group"><label>公告标题</label><input id="a_title" placeholder="请输入公告标题"></div>
      <div class="form-group"><label>公告内容</label><textarea id="a_content" placeholder="请输入公告内容"></textarea></div>
      <div class="form-row">
        <div class="form-group"><label>推送目标</label><select id="a_target"><option value="all">全部用户</option><option value="user">普通用户</option><option value="technician">师傅</option><option value="merchant">商家</option></select></div>
        <div class="form-group"><label>是否置顶</label><select id="a_pinned"><option value="0">否</option><option value="1">是</option></select></div>
      </div>
      <div class="form-group"><label>发布时间</label><input id="a_publish_time" type="datetime-local"></div>
    </div>
    <div class="modal-footer"><button class="btn-default" onclick="closeModal('formModal')">取消</button><button class="btn-primary" onclick="saveAnnouncement()">发布</button></div>
  </div>
</div>

<!-- Read Receipts Modal -->
<div class="modal-overlay" id="readersModal">
  <div class="modal modal-sm">
    <div class="modal-header"><h3>已读用户</h3><button class="modal-close" onclick="closeModal('readersModal')">&times;</button></div>
    <div class="modal-body" id="readersBody"></div>
    <div class="modal-footer"><button class="btn-default" onclick="closeModal('readersModal')">关闭</button></div>
  </div>
</div>

<script>
const token = localStorage.getItem('admin_token');
if (!token) window.location.href = 'login.html';
function getHeaders() { return { 'Content-Type':'application/json', 'Authorization':'Bearer '+token }; }

let editId = null;

function formatDate(d) { if(!d) return '-'; const dt=new Date(d); return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0')+' '+String(dt.getHours()).padStart(2,'0')+':'+String(dt.getMinutes()).padStart(2,'0'); }

const targetMap = { all:'全部用户', user:'普通用户', technician:'师傅', merchant:'商家' };

function loadAnnouncements() {
  fetch('/api/admin/announcements', { headers: getHeaders() }).then(r=>r.json()).then(res=>{
    const data = res.data || res;
    const list = data.announcements || data.list || data.data || [];
    const tbody = document.getElementById('announcementTableBody');
    if (list.length) {
      tbody.innerHTML = list.map(a => `<tr>
        <td>${a.title||'-'}</td>
        <td>${targetMap[a.target]||a.target||'-'}</td>
        <td>${a.pinned?'📌 是':'-'}</td>
        <td>${formatDate(a.publish_time||a.created_at)}</td>
        <td><span class="status-badge" style="background:${a.status==='published'||!a.status?'#f6ffed':'#f5f5f5'};color:${a.status==='published'||!a.status?'#52c41a':'#999'}">${a.status==='published'||!a.status?'已发布':'草稿'}</span></td>
        <td>
          <span class="action-link" onclick="openEditModal(${a.id})">编辑</span>
          <span class="action-link" onclick="viewReaders(${a.id})">查看已读</span>
          <span class="action-link danger" onclick="deleteAnnouncement(${a.id})">删除</span>
        </td>
      </tr>`).join('');
    } else {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#999;padding:30px;">暂无公告</td></tr>';
    }
  }).catch(()=>{});
}

function openAddModal() {
  editId = null;
  document.getElementById('formTitle').textContent = '发布公告';
  document.getElementById('a_title').value = '';
  document.getElementById('a_content').value = '';
  document.getElementById('a_target').value = 'all';
  document.getElementById('a_pinned').value = '0';
  document.getElementById('a_publish_time').value = '';
  document.getElementById('formModal').classList.add('show');
}

function openEditModal(id) {
  editId = id;
  document.getElementById('formTitle').textContent = '编辑公告';
  fetch('/api/admin/announcements', { headers: getHeaders() }).then(r=>r.json()).then(res=>{
    const data = res.data || res;
    const list = data.announcements || data.list || data.data || [];
    const a = list.find(x => x.id == id);
    if (a) {
      document.getElementById('a_title').value = a.title || '';
      document.getElementById('a_content').value = a.content || '';
      document.getElementById('a_target').value = a.target || 'all';
      document.getElementById('a_pinned').value = a.pinned ? '1' : '0';
      document.getElementById('a_publish_time').value = a.publish_time ? a.publish_time.slice(0,16) : '';
    }
    document.getElementById('formModal').classList.add('show');
  }).catch(()=>{});
}

function saveAnnouncement() {
  const body = {
    title: document.getElementById('a_title').value,
    content: document.getElementById('a_content').value,
    target: document.getElementById('a_target').value,
    pinned: document.getElementById('a_pinned').value === '1',
    publish_time: document.getElementById('a_publish_time').value || null
  };
  if (!body.title || !body.content) { alert('请填写标题和内容'); return; }
  const url = editId ? '/api/admin/announcements/' + editId : '/api/admin/announcements';
  const method = editId ? 'PUT' : 'POST';
  fetch(url, { method, headers: getHeaders(), body: JSON.stringify(body) }).then(r=>r.json()).then(res=>{
    if (res.code===0 || res.success) { closeModal('formModal'); loadAnnouncements(); } else alert(res.message||'操作失败');
  }).catch(()=>alert('网络错误'));
}

function deleteAnnouncement(id) {
  if (!confirm('确定要删除此公告吗？')) return;
  fetch('/api/admin/announcements/' + id, { method: 'DELETE', headers: getHeaders() }).then(r=>r.json()).then(res=>{
    if (res.code===0 || res.success) loadAnnouncements(); else alert(res.message||'删除失败');
  }).catch(()=>alert('网络错误'));
}

function viewReaders(id) {
  fetch('/api/admin/announcements/' + id + '/readers', { headers: getHeaders() }).then(r=>r.json()).then(res=>{
    const data = res.data || res;
    const list = data.readers || data.list || data.data || [];
    const body = document.getElementById('readersBody');
    if (list.length) {
      body.innerHTML = '<table style="font-size:12px;"><thead><tr><th>用户</th><th>角色</th><th>阅读时间</th></tr></thead><tbody>' +
        list.map(r => `<tr><td>${r.user_name||r.name||'-'}</td><td>${r.role||'-'}</td><td>${formatDate(r.read_at)}</td></tr>`).join('') +
        '</tbody></table>';
    } else {
      body.innerHTML = '<div style="text-align:center;padding:30px;color:#999;">暂无已读记录</div>';
    }
    document.getElementById('readersModal').classList.add('show');
  }).catch(()=>alert('加载失败'));
}

function closeModal(id) { document.getElementById(id).classList.remove('show'); }

loadAnnouncements();
</script>
</body>
</html>
