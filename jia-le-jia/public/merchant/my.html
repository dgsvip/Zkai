<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>我的 - 佳乐家商家端</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif; background: #f5f5f5; color: #333; padding-bottom: 70px; min-height: 100vh; }
:root { --primary: #1677FF; --primary-light: #e6f4ff; --primary-dark: #0958d9; --text-secondary: #666; --text-muted: #999; --border: #eee; --card-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.hidden { display: none !important; }
.btn { display: inline-flex; align-items: center; justify-content: center; padding: 10px 24px; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; transition: all .2s; }
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:active { background: var(--primary-dark); }
.btn-block { width: 100%; }
.btn-sm { padding: 6px 14px; font-size: 13px; }
.input { width: 100%; padding: 10px 14px; border: 1px solid #d9d9d9; border-radius: 6px; font-size: 15px; outline: none; transition: border .2s; }
.input:focus { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(22,119,255,0.15); }
.card { background: #fff; border-radius: 10px; padding: 16px; margin: 12px 16px; box-shadow: var(--card-shadow); }
.section-title { font-size: 16px; font-weight: 600; margin-bottom: 12px; color: #333; }

/* Login Modal */
.login-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
.login-modal { background: #fff; border-radius: 12px; padding: 28px 24px; width: 100%; max-width: 380px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); }
.login-modal h2 { text-align: center; font-size: 20px; margin-bottom: 6px; }
.login-modal .subtitle { text-align: center; font-size: 13px; color: var(--text-muted); margin-bottom: 20px; }
.login-modal .form-group { margin-bottom: 14px; }
.login-modal .form-group label { display: block; font-size: 14px; margin-bottom: 4px; color: var(--text-secondary); }
.login-modal .error-msg { color: #ff4d4f; font-size: 13px; text-align: center; margin-top: 8px; min-height: 20px; }
.login-modal .test-hint { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 12px; padding: 8px; background: #fafafa; border-radius: 6px; }

/* Header / Merchant Card */
.merchant-header { background: linear-gradient(135deg, var(--primary) 0%, #4096ff 100%); color: #fff; padding: 24px 16px 30px; text-align: center; }
.merchant-header .avatar { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.2); margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; font-size: 32px; border: 2px solid rgba(255,255,255,0.4); }
.merchant-header .name { font-size: 18px; font-weight: 600; }
.merchant-header .detail { font-size: 13px; opacity: .9; margin-top: 4px; }
.merchant-header .detail span { margin: 0 8px; }
.merchant-header .join-date { font-size: 12px; opacity: .7; margin-top: 4px; }

/* Earnings */
.earnings-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.earnings-item { text-align: center; padding: 12px 4px; background: #fafafa; border-radius: 8px; }
.earnings-item .num { font-size: 18px; font-weight: 700; color: var(--primary); }
.earnings-item .label { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

/* Settlement Records */
.settlement-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
.settlement-item:last-child { border-bottom: none; }
.settlement-item .left .title { font-size: 14px; }
.settlement-item .left .time { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
.settlement-item .right { text-align: right; }
.settlement-item .right .amount { font-size: 15px; font-weight: 600; color: #333; }
.settlement-item .right .status { font-size: 12px; }
.settlement-item .right .status.settled { color: #52c41a; }
.settlement-item .right .status.pending { color: #fa8c16; }

/* Withdraw Form */
.withdraw-row { display: flex; align-items: center; gap: 10px; }
.withdraw-row .input { flex: 1; }
.withdraw-hint { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

/* Menu List */
.menu-list { margin: 0; }
.menu-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
.menu-item:last-child { border-bottom: none; }
.menu-item:active { opacity: .6; }
.menu-item .left { display: flex; align-items: center; gap: 10px; }
.menu-item .left .menu-icon { font-size: 20px; }
.menu-item .left .menu-text { font-size: 14px; color: #333; }
.menu-item .arrow { color: #ccc; font-size: 14px; }

/* Bottom Tab */
.bottom-tab { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; border-top: 1px solid var(--border); z-index: 100; }
.tab-item { flex: 1; text-align: center; padding: 8px 0 6px; font-size: 11px; color: var(--text-muted); cursor: pointer; transition: color .2s; }
.tab-item .tab-icon { font-size: 22px; line-height: 1; margin-bottom: 2px; }
.tab-item.active { color: var(--primary); }
.tab-item:active { opacity: .6; }

/* Toast */
.toast { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.75); color: #fff; padding: 12px 24px; border-radius: 8px; font-size: 14px; z-index: 2000; pointer-events: none; animation: fadeInOut 2s ease; }
@keyframes fadeInOut { 0% { opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { opacity: 0; } }

/* Empty state */
.empty-state { text-align: center; padding: 20px 0; color: var(--text-muted); font-size: 14px; }
</style>
</head>
<body>

<!-- Login Modal -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-modal">
    <h2>商家登录</h2>
    <p class="subtitle">佳乐家家电服务预约平台</p>
    <div class="form-group">
      <label>手机号</label>
      <input class="input" id="loginPhone" type="tel" placeholder="请输入手机号" maxlength="11">
    </div>
    <div class="form-group">
      <label>密码</label>
      <input class="input" id="loginPassword" type="password" placeholder="请输入密码">
    </div>
    <div id="loginError" class="error-msg"></div>
    <button class="btn btn-primary btn-block" id="loginBtn" onclick="doLogin()">登 录</button>
    <div class="test-hint">测试账号：13900001111 / 13900002222，密码：123456</div>
  </div>
</div>

<!-- Merchant Header -->
<div id="merchantHeader" class="merchant-header hidden">
  <div class="avatar">👤</div>
  <div class="name" id="merchantName"></div>
  <div class="detail">
    <span id="merchantContact"></span>
    <span id="merchantPhone"></span>
  </div>
  <div class="join-date" id="merchantJoinDate"></div>
</div>

<!-- Content (shown after login) -->
<div id="pageContent" class="hidden">

  <!-- Earnings Center -->
  <div class="card">
    <div class="section-title">收益中心</div>
    <div class="earnings-grid">
      <div class="earnings-item"><div class="num" id="earnMonthly">¥0</div><div class="label">本月收益</div></div>
      <div class="earnings-item"><div class="num" id="earnTotal">¥0</div><div class="label">累计推广费</div></div>
      <div class="earnings-item"><div class="num" id="earnPending">¥0</div><div class="label">待结算</div></div>
    </div>
  </div>

  <!-- Withdraw -->
  <div class="card">
    <div class="section-title">申请提现</div>
    <div class="withdraw-row">
      <span style="font-size:18px; font-weight:600; color:var(--primary);">¥</span>
      <input class="input" id="withdrawAmount" type="number" placeholder="请输入提现金额" min="1" step="0.01">
      <button class="btn btn-primary btn-sm" onclick="applyWithdraw()">提现</button>
    </div>
    <div class="withdraw-hint">可结算余额：¥<span id="settledBalance">0.00</span>，最低提现10元</div>
  </div>

  <!-- Settlement Records -->
  <div class="card">
    <div class="section-title">结算记录</div>
    <div id="settlementList"></div>
  </div>

  <!-- Menu -->
  <div class="card" style="padding: 4px 16px;">
    <div class="menu-list">
      <div class="menu-item" onclick="showToast('推广二维码')">
        <div class="left"><span class="menu-icon">📱</span><span class="menu-text">推广二维码</span></div>
        <span class="arrow">›</span>
      </div>
      <div class="menu-item" onclick="showToast('渠道统计')">
        <div class="left"><span class="menu-icon">📊</span><span class="menu-text">渠道统计</span></div>
        <span class="arrow">›</span>
      </div>
      <div class="menu-item" onclick="showToast('常见问题')">
        <div class="left"><span class="menu-icon">❓</span><span class="menu-text">常见问题</span></div>
        <span class="arrow">›</span>
      </div>
      <div class="menu-item" onclick="showToast('历史公告')">
        <div class="left"><span class="menu-icon">📢</span><span class="menu-text">历史公告</span></div>
        <span class="arrow">›</span>
      </div>
      <div class="menu-item" onclick="showToast('平台服务协议')">
        <div class="left"><span class="menu-icon">📄</span><span class="menu-text">平台服务协议</span></div>
        <span class="arrow">›</span>
      </div>
      <div class="menu-item" onclick="showToast('联系客服：400-800-8888')">
        <div class="left"><span class="menu-icon">📞</span><span class="menu-text">联系客服</span></div>
        <span class="arrow">›</span>
      </div>
    </div>
  </div>

  <!-- Logout -->
  <div class="card" style="text-align: center;">
    <button class="btn btn-outline" style="border:1px solid #ff4d4f;color:#ff4d4f;background:transparent;padding:10px 40px;border-radius:6px;font-size:15px;cursor:pointer;" onclick="doLogout()">退出登录</button>
  </div>
</div>

<!-- Bottom Tab -->
<div class="bottom-tab">
  <div class="tab-item" onclick="navigate('promotion')">
    <div class="tab-icon">📢</div>
    <div>推广</div>
  </div>
  <div class="tab-item" onclick="navigate('referral')">
    <div class="tab-icon">📝</div>
    <div>代报</div>
  </div>
  <div class="tab-item active" onclick="navigate('my')">
    <div class="tab-icon">👤</div>
    <div>我的</div>
  </div>
</div>

<script>
const API_BASE = '';
const TOKEN_KEY = 'jl_merchant_token';
const MERCHANT_KEY = 'jl_merchant_info';

let merchantId = null;
let merchantInfo = null;

// ---- Auth ----
function getToken() { return localStorage.getItem(TOKEN_KEY); }
function getMerchantInfo() {
  try { return JSON.parse(localStorage.getItem(MERCHANT_KEY)); } catch { return null; }
}

function checkLogin() {
  const token = getToken();
  const info = getMerchantInfo();
  if (token && info && info.id) {
    merchantId = info.id;
    merchantInfo = info;
    document.getElementById('loginOverlay').classList.add('hidden');
    document.getElementById('merchantHeader').classList.remove('hidden');
    document.getElementById('pageContent').classList.remove('hidden');
    renderMerchantInfo();
    loadEarnings();
    loadSettlements();
    return true;
  }
  document.getElementById('loginOverlay').classList.remove('hidden');
  return false;
}

async function doLogin() {
  const phone = document.getElementById('loginPhone').value.trim();
  const password = document.getElementById('loginPassword').value.trim();
  const errorEl = document.getElementById('loginError');
  errorEl.textContent = '';
  if (!phone || !password) { errorEl.textContent = '请输入手机号和密码'; return; }
  if (!/^1\d{10}$/.test(phone)) { errorEl.textContent = '请输入正确的手机号'; return; }
  const btn = document.getElementById('loginBtn');
  btn.disabled = true;
  btn.textContent = '登录中...';
  try {
    const res = await fetch(API_BASE + '/api/merchant/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ phone, password })
    });
    const data = await res.json();
    if (res.ok && data.token) {
      localStorage.setItem(TOKEN_KEY, data.token);
      localStorage.setItem(MERCHANT_KEY, JSON.stringify(data.merchant || data));
      checkLogin();
    } else {
      errorEl.textContent = data.message || '登录失败，请检查账号密码';
    }
  } catch (e) {
    errorEl.textContent = '网络错误，请稍后重试';
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

function doLogout() {
  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(MERCHANT_KEY);
  window.location.reload();
}

function renderMerchantInfo() {
  if (!merchantInfo) return;
  document.getElementById('merchantName').textContent = merchantInfo.name || '未设置';
  document.getElementById('merchantContact').textContent = '联系人：' + (merchantInfo.contact || merchantInfo.name || '-');
  document.getElementById('merchantPhone').textContent = '电话：' + (merchantInfo.phone || '-');
  const joinDate = merchantInfo.created_at || merchantInfo.join_date || merchantInfo.create_time;
  if (joinDate) {
    document.getElementById('merchantJoinDate').textContent = '加入时间：' + formatTime(joinDate);
  }
}

// ---- Earnings ----
async function loadEarnings() {
  if (!merchantId) return;
  try {
    const res = await fetch(API_BASE + '/api/merchant/' + merchantId + '/earnings', {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    if (!res.ok) return;
    const data = await res.json();
    const e = data.data || data;
    document.getElementById('earnMonthly').textContent = '¥' + ((e.monthly_earnings ?? e.monthlyEarnings ?? 0)).toFixed(2);
    document.getElementById('earnTotal').textContent = '¥' + ((e.total_referral_fee ?? e.totalReferralFee ?? 0)).toFixed(2);
    document.getElementById('earnPending').textContent = '¥' + ((e.pending_amount ?? e.pendingAmount ?? 0)).toFixed(2);
    document.getElementById('settledBalance').textContent = ((e.settled_amount ?? e.settledAmount ?? 0)).toFixed(2);
  } catch (e) { /* ignore */ }
}

// ---- Settlements ----
async function loadSettlements() {
  if (!merchantId) return;
  const container = document.getElementById('settlementList');
  try {
    const res = await fetch(API_BASE + '/api/merchant/' + merchantId + '/settlements', {
      headers: { 'Authorization': 'Bearer ' + getToken() }
    });
    if (!res.ok) { container.innerHTML = '<div class="empty-state">加载失败</div>'; return; }
    const data = await res.json();
    const list = data.data || data.list || data.records || [];
    if (!list || list.length === 0) {
      container.innerHTML = '<div class="empty-state">暂无结算记录</div>';
      return;
    }
    container.innerHTML = '';
    list.forEach(function(item) {
      const div = document.createElement('div');
      div.className = 'settlement-item';
      const amount = parseFloat(item.amount || 0);
      const statusMap = { 'settled': '已结算', 'pending': '处理中', 'completed': '已完成' };
      const status = item.status_label || statusMap[item.status] || item.status || '-';
      const statusClass = item.status === 'settled' || item.status === 'completed' ? 'settled' : 'pending';
      div.innerHTML = '<div class="left"><div class="title">' + (item.title || item.description || '结算') + '</div><div class="time">' + formatTime(item.created_at || item.create_time) + '</div></div><div class="right"><div class="amount">¥' + amount.toFixed(2) + '</div><div class="status ' + statusClass + '">' + status + '</div></div>';
      container.appendChild(div);
    });
  } catch (e) {
    container.innerHTML = '<div class="empty-state">加载失败</div>';
  }
}

// ---- Withdraw ----
async function applyWithdraw() {
  const amount = parseFloat(document.getElementById('withdrawAmount').value);
  if (!amount || amount <= 0) { showToast('请输入有效的提现金额'); return; }
  if (amount < 10) { showToast('最低提现金额为10元'); return; }
  const btn = document.querySelector('.withdraw-row .btn-primary');
  btn.disabled = true;
  btn.textContent = '提交中...';
  try {
    const res = await fetch(API_BASE + '/api/merchant/withdraw', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + getToken()
      },
      body: JSON.stringify({ merchant_id: merchantId, amount: amount })
    });
    const data = await res.json();
    if (res.ok) {
      showToast('提现申请已提交');
      document.getElementById('withdrawAmount').value = '';
      loadEarnings();
      loadSettlements();
    } else {
      showToast(data.message || '提现失败，请重试');
    }
  } catch (e) {
    showToast('网络错误，请稍后重试');
  } finally {
    btn.disabled = false;
    btn.textContent = '提现';
  }
}

// ---- Toast ----
function showToast(msg) {
  const existing = document.querySelector('.toast');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(function() { el.remove(); }, 2000);
}

// ---- Helpers ----
function formatTime(t) {
  if (!t) return '-';
  try {
    const d = new Date(t);
    if (isNaN(d.getTime())) return t;
    const pad = function(n) { return n < 10 ? '0' + n : n; };
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  } catch { return t; }
}

// ---- Navigation ----
function navigate(page) {
  if (page === 'promotion') window.location.href = 'promotion.html';
  if (page === 'referral') window.location.href = 'referral.html';
  if (page === 'my') return;
}

// ---- Init ----
checkLogin();
</script>
</body>
</html>
