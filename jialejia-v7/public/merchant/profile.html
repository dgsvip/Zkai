<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的 - 佳乐家商家端</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    /* ===== 商家信息头部 ===== */
    .profile-header { background: linear-gradient(135deg, var(--primary), #4096FF); padding: 24px 20px; color: #fff; text-align: center; }
    .profile-avatar { width: 64px; height: 64px; border-radius: 50%; background: rgba(255,255,255,0.25); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; font-size: 28px; font-weight: 700; }
    .profile-name { font-size: 18px; font-weight: 600; }
    .profile-info { font-size: 13px; opacity: 0.85; margin-top: 4px; }
    .profile-meta { display: flex; justify-content: center; gap: 20px; margin-top: 10px; font-size: 12px; opacity: 0.8; }

    /* ===== 收益中心 ===== */
    .income-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .income-item { text-align: center; padding: 14px 6px; background: var(--bg); border-radius: 8px; }
    .income-item .amount { font-size: 18px; font-weight: 700; color: var(--primary); }
    .income-item .label { font-size: 11px; color: var(--text-light); margin-top: 4px; }
    .income-item .amount.success { color: var(--success); }
    .income-item .amount.warning { color: var(--warning); }

    .income-summary { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 10px; }
    .income-summary .income-item { padding: 12px 6px; }

    /* ===== 结算记录 ===== */
    .settle-item { display: flex; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .settle-item:last-child { border-bottom: none; }
    .settle-info { flex: 1; }
    .settle-time { font-size: 12px; color: var(--text-light); }
    .settle-status { font-size: 12px; margin-top: 2px; }
    .settle-amount { font-weight: 600; }
    .settle-amount.out { color: var(--text); }

    /* ===== 菜单列表 ===== */
    .menu-list { }
    .menu-item { display: flex; align-items: center; padding: 14px 0; border-bottom: 1px solid var(--border); cursor: pointer; }
    .menu-item:last-child { border-bottom: none; }
    .menu-item:active { background: var(--bg); margin: 0 -16px; padding: 14px 16px; border-radius: 8px; }
    .menu-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-size: 16px; margin-right: 12px; flex-shrink: 0; }
    .menu-icon.q { background: #E6F4FF; }
    .menu-icon.file { background: #F6FFED; }
    .menu-icon.agreement { background: #FFF7E6; }
    .menu-icon.service { background: #FFF0F0; }
    .menu-label { flex: 1; font-size: 14px; }
    .menu-arrow { color: var(--text-light); font-size: 14px; }

    /* ===== 退出按钮 ===== */
    .logout-btn { margin: 24px 16px; }

    /* ===== 提现弹窗 ===== */
    .withdraw-form { padding: 8px 0; }
    .withdraw-amount { font-size: 32px; font-weight: 700; text-align: center; color: var(--text); }
    .withdraw-amount input { font-size: 32px; font-weight: 700; text-align: center; border: none; outline: none; width: 100%; padding: 8px 0; }
    .withdraw-amount .unit { font-size: 16px; color: var(--text-light); font-weight: 400; }
    .withdraw-hint { text-align: center; font-size: 12px; color: var(--text-light); margin-top: 8px; }

    /* ===== 内容区 ===== */
    .section { padding: 0 16px; }
    .section-gap { height: 12px; }
  </style>
</head>
<body>
  <div class="page" id="app">
    <!-- ====== 商家信息头部 ====== -->
    <div class="profile-header">
      <div class="profile-avatar">商</div>
      <div class="profile-name" id="merchantName">--</div>
      <div class="profile-info" id="merchantContact">联系人：-- | 电话：--</div>
      <div class="profile-meta">
        <span id="merchantJoinTime">入驻时间：--</span>
      </div>
    </div>

    <!-- ====== 收益中心 ====== -->
    <div class="section" style="padding-top:16px;">
      <div class="card">
        <div class="card-header">
          <span class="card-title">💰 收益中心</span>
        </div>
        <div class="card-body">
          <div class="income-grid">
            <div class="income-item">
              <div class="amount" id="incomeThisMonth">¥0</div>
              <div class="label">本月已赚</div>
            </div>
            <div class="income-item">
              <div class="amount" id="incomeLastMonth">¥0</div>
              <div class="label">上月已赚</div>
            </div>
            <div class="income-item">
              <div class="amount" id="incomeTotal">¥0</div>
              <div class="label">累计介绍费</div>
            </div>
          </div>
          <div class="income-summary">
            <div class="income-item">
              <div class="amount success" id="incomeSettled">¥0</div>
              <div class="label">已结算</div>
            </div>
            <div class="income-item">
              <div class="amount warning" id="incomePending">¥0</div>
              <div class="label">待结算</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- ====== 结算记录 ====== -->
    <div class="section">
      <div class="card">
        <div class="card-header">
          <span class="card-title">📋 结算记录</span>
        </div>
        <div class="card-body" id="settleList">
          <div class="loading"><div class="loading-spinner"></div>加载中...</div>
        </div>
      </div>
    </div>

    <!-- ====== 申请提现 ====== -->
    <div class="section">
      <button class="btn btn-primary btn-lg" onclick="showWithdrawModal()">申请提现</button>
    </div>

    <!-- ====== 菜单列表 ====== -->
    <div class="section" style="margin-top:16px;">
      <div class="card">
        <div class="menu-list">
          <div class="menu-item" onclick="Utils.toast('常见问题功能开发中')">
            <div class="menu-icon q">❓</div>
            <span class="menu-label">常见问题</span>
            <span class="menu-arrow">›</span>
          </div>
          <div class="menu-item" onclick="Utils.toast('历史公告功能开发中')">
            <div class="menu-icon file">📄</div>
            <span class="menu-label">历史公告</span>
            <span class="menu-arrow">›</span>
          </div>
          <div class="menu-item" onclick="Utils.toast('平台协议功能开发中')">
            <div class="menu-icon agreement">📜</div>
            <span class="menu-label">平台协议</span>
            <span class="menu-arrow">›</span>
          </div>
          <div class="menu-item" onclick="Utils.toast('客服热线：400-000-0000')">
            <div class="menu-icon service">📞</div>
            <span class="menu-label">联系客服</span>
            <span class="menu-arrow">›</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ====== 退出登录 ====== -->
    <div class="logout-btn">
      <button class="btn btn-outline btn-block" onclick="handleLogout()">退出登录</button>
    </div>

    <div class="section-gap"></div>

    <!-- ====== 底部导航栏 ====== -->
    <div class="tabbar">
      <div class="tabbar-item" onclick="Utils.go('/merchant/promote.html')">
        <i>📢</i><span>推广</span>
      </div>
      <div class="tabbar-item" onclick="Utils.go('/merchant/proxy.html')">
        <i>📝</i><span>代报</span>
      </div>
      <div class="tabbar-item active" onclick="Utils.go('/merchant/profile.html')">
        <i>👤</i><span>我的</span>
      </div>
    </div>

    <!-- ====== 提现弹窗 ====== -->
    <div class="modal-overlay hidden" id="withdrawModal">
      <div class="modal-box" style="position:relative;">
        <div class="modal-title">申请提现</div>
        <div class="withdraw-form">
          <div class="withdraw-amount">
            <span class="unit">¥</span>
            <input type="number" id="withdrawAmount" placeholder="0.00" min="0.01" step="0.01">
          </div>
          <div class="withdraw-hint" id="withdrawHint">可提现余额：¥0.00</div>
        </div>
        <div class="flex gap-8" style="margin-top:20px;">
          <button class="btn btn-ghost btn-block" onclick="hideWithdrawModal()">取消</button>
          <button class="btn btn-primary btn-block" onclick="confirmWithdraw()">确认提现</button>
        </div>
      </div>
    </div>
  </div>

  <script src="../common.js"></script>
  <script>
    // ===== 页面状态 =====
    let withdrawableAmount = 0;

    // ===== 初始化 =====
    document.addEventListener('DOMContentLoaded', function() {
      if (!checkAuth()) return;
      loadProfile();
      loadIncome();
      loadSettles();
    });

    function checkAuth() {
      const token = Utils.get('token');
      if (!token) {
        Utils.error('请先登录');
        Utils.go('/merchant/promote.html');
        return false;
      }
      API.token = token;
      return true;
    }

    // ===== 加载商家信息 =====
    async function loadProfile() {
      try {
        const res = await API.merGetStatistics();
        if (res.code === 0 && res.data) {
          const d = res.data;
          document.getElementById('merchantName').textContent = d.merchant_name || d.name || '--';
          document.getElementById('merchantContact').textContent = '联系人：' + (d.contact_name || '--') + ' | 电话：' + (d.contact_phone || d.phone || '--');
          const joinTime = d.created_at || d.join_time || '';
          document.getElementById('merchantJoinTime').textContent = '入驻时间：' + (joinTime ? Utils.formatDate(joinTime) : '--');
        } else {
          const local = Utils.get('userInfo');
          if (local) {
            document.getElementById('merchantName').textContent = local.merchant_name || local.name || '--';
            document.getElementById('merchantContact').textContent = '联系人：' + (local.contact_name || '--') + ' | 电话：' + (local.contact_phone || local.phone || '--');
            const joinTime = local.created_at || local.join_time || '';
            document.getElementById('merchantJoinTime').textContent = '入驻时间：' + (joinTime ? Utils.formatDate(joinTime) : '--');
          }
        }
      } catch (e) {
        const local = Utils.get('userInfo');
        if (local) {
          document.getElementById('merchantName').textContent = local.merchant_name || local.name || '--';
          document.getElementById('merchantContact').textContent = '联系人：' + (local.contact_name || '--') + ' | 电话：' + (local.contact_phone || local.phone || '--');
        }
      }
    }

    // ===== 加载收益数据 =====
    async function loadIncome() {
      try {
        const res = await API.merGetIncome();
        if (res.code === 0 && res.data) {
          const d = res.data;
          document.getElementById('incomeThisMonth').textContent = Utils.formatPrice(d.this_month || 0);
          document.getElementById('incomeLastMonth').textContent = Utils.formatPrice(d.last_month || 0);
          document.getElementById('incomeTotal').textContent = Utils.formatPrice(d.total || 0);
          document.getElementById('incomeSettled').textContent = Utils.formatPrice(d.settled || 0);
          document.getElementById('incomePending').textContent = Utils.formatPrice(d.pending || 0);
          withdrawableAmount = d.settled || 0;
          document.getElementById('withdrawHint').textContent = '可提现余额：' + Utils.formatPrice(withdrawableAmount);
        } else {
          // 尝试从统计数据获取
          const statsRes = await API.merGetStatistics();
          if (statsRes.code === 0 && statsRes.data) {
            const d = statsRes.data;
            document.getElementById('incomeThisMonth').textContent = Utils.formatPrice(d.this_month_income || 0);
            document.getElementById('incomeLastMonth').textContent = Utils.formatPrice(d.last_month_income || 0);
            document.getElementById('incomeTotal').textContent = Utils.formatPrice(d.total_income || 0);
            document.getElementById('incomeSettled').textContent = Utils.formatPrice(d.settled_income || 0);
            document.getElementById('incomePending').textContent = Utils.formatPrice(d.pending_income || 0);
            withdrawableAmount = d.settled_income || 0;
            document.getElementById('withdrawHint').textContent = '可提现余额：' + Utils.formatPrice(withdrawableAmount);
          }
        }
      } catch (e) {
        // 静默处理
      }
    }

    // ===== 加载结算记录 =====
    async function loadSettles() {
      const container = document.getElementById('settleList');
      try {
        const res = await API.merGetWithdraws();
        let list = [];
        if (res.code === 0 && res.data) {
          list = Array.isArray(res.data) ? res.data : (res.data.list || res.data.withdraws || []);
        }
        if (list.length === 0) {
          container.innerHTML = '<div class="empty"><p>暂无结算记录</p></div>';
          return;
        }
        let html = '';
        list.forEach(item => {
          const statusMap = { pending: '处理中', processing: '处理中', completed: '已到账', failed: '失败', rejected: '已拒绝' };
          const status = statusMap[item.status] || item.status || '--';
          const statusClass = item.status === 'completed' ? 'text-success' : item.status === 'failed' || item.status === 'rejected' ? 'text-danger' : 'text-warning';
          html += '<div class="settle-item">' +
            '<div class="settle-info"><div class="settle-time">' + Utils.formatTime(item.created_at) + '</div>' +
            '<div class="settle-status ' + statusClass + '">' + status + '</div></div>' +
            '<div class="settle-amount out">' + Utils.formatPrice(item.amount || 0) + '</div>' +
          '</div>';
        });
        container.innerHTML = html;
      } catch (e) {
        container.innerHTML = '<div class="empty"><p>加载失败</p></div>';
      }
    }

    // ===== 提现弹窗 =====
    function showWithdrawModal() {
      document.getElementById('withdrawModal').classList.remove('hidden');
      document.getElementById('withdrawAmount').value = '';
      document.getElementById('withdrawAmount').focus();
    }

    function hideWithdrawModal() {
      document.getElementById('withdrawModal').classList.add('hidden');
    }

    async function confirmWithdraw() {
      const amount = parseFloat(document.getElementById('withdrawAmount').value);
      if (!amount || amount <= 0) return Utils.error('请输入提现金额');
      if (amount > withdrawableAmount) return Utils.error('提现金额超过可提现余额');

      Utils.loading(true);
      try {
        const res = await API.merWithdraw(amount);
        if (res.code === 0) {
          Utils.success('提现申请已提交');
          hideWithdrawModal();
          // 刷新收益和结算记录
          loadIncome();
          loadSettles();
        } else {
          Utils.error(res.message || '提现申请失败');
        }
      } catch (e) {
        Utils.error('网络异常');
      } finally {
        Utils.loading(false);
      }
    }

    // ===== 退出登录 =====
    function handleLogout() {
      const overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      overlay.innerHTML = '<div class="modal-box" style="position:relative;"><div class="modal-title">确认退出</div><p style="text-align:center;color:var(--text-secondary);margin-bottom:20px;">确定要退出登录吗？</p><div class="flex gap-8"><button class="btn btn-ghost btn-block" onclick="this.closest(\'.modal-overlay\').remove()">取消</button><button class="btn btn-danger btn-block" onclick="doLogout()">确认退出</button></div></div>';
      document.body.appendChild(overlay);
    }

    function doLogout() {
      // 移除遮罩
      const overlay = document.querySelector('.modal-overlay');
      if (overlay) overlay.remove();
      Utils.logout();
    }
  </script>
</body>
</html>
