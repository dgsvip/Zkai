<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>查单 - 佳乐家</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    /* ===== 查单页专用样式 ===== */
    /* 登录界面 */
    .login-section {
      padding: 40px 32px 20px;
      text-align: center;
    }
    .login-section .login-icon { font-size: 56px; margin-bottom: 16px; }
    .login-section .login-title { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    .login-section .login-desc { font-size: 14px; color: var(--text-light); margin-bottom: 32px; }
    .login-section .form-group { text-align: left; }
    .login-section .code-row { display: flex; gap: 10px; }
    .login-section .code-row .form-input { flex: 1; }
    .login-section .code-row .btn-send { flex-shrink: 0; padding: 12px 16px; font-size: 13px; }
    .verify-code-display {
      font-size: 32px; font-weight: 700; color: var(--primary);
      border: 2px solid var(--primary); border-radius: 12px;
      padding: 12px 16px; text-align: center; margin: 12px 0;
      letter-spacing: 8px; background: var(--primary-light);
    }

    /* 订单Tab */
    .order-tabs {
      display: flex; background: var(--bg-white); border-bottom: 1px solid var(--border);
      position: sticky; top: 0; z-index: 50;
    }
    .order-tab {
      flex: 1; text-align: center; padding: 12px 0; font-size: 13px;
      color: var(--text-secondary); cursor: pointer; position: relative; transition: color 0.2s;
    }
    .order-tab.active { color: var(--primary); font-weight: 600; }
    .order-tab.active::after {
      content: ''; position: absolute; bottom: 0; left: 20%; right: 20%;
      height: 3px; background: var(--primary); border-radius: 3px 3px 0 0;
    }

    /* 订单卡片 */
    .order-list { padding: 12px 16px; }
    .order-card {
      background: var(--bg-white); border-radius: var(--radius);
      padding: 16px; margin-bottom: 12px; box-shadow: var(--shadow);
      cursor: pointer; transition: all 0.2s;
    }
    .order-card:active { transform: scale(0.99); }
    .order-card .oc-header {
      display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;
    }
    .order-card .oc-no { font-size: 12px; color: var(--text-light); }
    .order-card .oc-name { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
    .order-card .oc-info { font-size: 13px; color: var(--text-secondary); line-height: 1.8; }
    .order-card .oc-tech { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-secondary); display: flex; align-items: center; gap: 8px; }

    /* 订单详情 */
    .detail-section { padding: 12px 16px; }

    /* 时间线 */
    .timeline { position: relative; padding-left: 24px; }
    .timeline::before {
      content: ''; position: absolute; left: 7px; top: 4px; bottom: 4px;
      width: 2px; background: var(--border);
    }
    .timeline-item { position: relative; padding-bottom: 20px; }
    .timeline-item:last-child { padding-bottom: 0; }
    .timeline-item::before {
      content: ''; position: absolute; left: -17px; top: 6px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--border); border: 2px solid var(--bg-white);
    }
    .timeline-item.active::before { background: var(--primary); }
    .timeline-item .tl-time { font-size: 12px; color: var(--text-light); }
    .timeline-item .tl-content { font-size: 14px; color: var(--text-secondary); margin-top: 2px; }

    /* 评价星 */
    .star-rating { display: flex; gap: 8px; justify-content: center; }
    .star-rating .star { font-size: 30px; cursor: pointer; color: #E0E0E0; transition: color 0.2s; }
    .star-rating .star.active { color: #FAAD14; }

    /* 师傅信息卡片 */
    .tech-card {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg); border-radius: var(--radius); padding: 12px;
    }
    .tech-card .tc-avatar {
      width: 48px; height: 48px; border-radius: 50%; object-fit: cover;
      background: var(--primary-light); display: flex; align-items: center; justify-content: center;
      color: var(--primary); font-size: 20px; font-weight: 600;
    }
    .tech-card .tc-info { flex: 1; }
    .tech-card .tc-name { font-size: 15px; font-weight: 600; }
    .tech-card .tc-rating { font-size: 13px; color: var(--text-secondary); }

    /* 底部操作按钮 */
    .detail-actions { margin-top: 16px; display: flex; gap: 10px; }

    /* 分页加载 */
    .load-more { text-align: center; padding: 16px; color: var(--text-light); font-size: 13px; cursor: pointer; }
    .load-more:active { color: var(--primary); }
  </style>
</head>
<body>
<div class="page" id="app">
  <!-- 顶部导航 -->
  <div class="header">
    <span class="header-back" onclick="window.history.back()">‹</span>
    <span class="header-title">查单</span>
    <span class="header-right" id="headerRight"></span>
  </div>

  <!-- 登录界面 -->
  <div id="loginSection" class="login-section">
    <div class="login-icon">🔍</div>
    <div class="login-title">查询订单</div>
    <div class="login-desc">输入手机号获取验证码，即可查询您的所有订单</div>
    <div class="form-group">
      <label class="form-label">手机号</label>
      <input class="form-input" id="loginPhone" placeholder="请输入手机号" maxlength="11" type="tel">
    </div>
    <div class="form-group">
      <label class="form-label">验证码</label>
      <div class="code-row">
        <input class="form-input" id="loginCode" placeholder="请输入验证码" maxlength="4">
        <button class="btn btn-outline btn-send" id="btnSendCode">获取验证码</button>
      </div>
    </div>
    <div id="verifyCodeDisplay" class="verify-code-display hidden">----</div>
    <button class="btn btn-primary btn-lg btn-block mt-16" id="btnLogin">查询订单</button>
  </div>

  <!-- 订单列表（登录后显示） -->
  <div id="orderSection" class="hidden">
    <div class="order-tabs" id="orderTabs">
      <div class="order-tab active" data-status="all">全部</div>
      <div class="order-tab" data-status="pending">待接单</div>
      <div class="order-tab" data-status="accepted">进行中</div>
      <div class="order-tab" data-status="completed">已完成</div>
      <div class="order-tab" data-status="cancelled">已取消</div>
    </div>
    <div class="order-list" id="orderList"></div>
    <div class="load-more hidden" id="loadMore">加载更多</div>
  </div>

  <!-- 订单详情（覆盖） -->
  <div id="detailSection" class="hidden"></div>

  <!-- 评价弹窗 -->
  <div class="modal-overlay hidden" id="evaluateModal">
    <div class="modal-box">
      <div class="modal-title">服务评价</div>
      <div class="form-group">
        <label class="form-label" style="text-align:center;">服务态度</label>
        <div class="star-rating" id="starAttitude">
          <span class="star active" data-v="1">★</span><span class="star active" data-v="2">★</span><span class="star active" data-v="3">★</span><span class="star active" data-v="4">★</span><span class="star active" data-v="5">★</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" style="text-align:center;">技术水平</label>
        <div class="star-rating" id="starSkill">
          <span class="star active" data-v="1">★</span><span class="star active" data-v="2">★</span><span class="star active" data-v="3">★</span><span class="star active" data-v="4">★</span><span class="star active" data-v="5">★</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label" style="text-align:center;">准时度</label>
        <div class="star-rating" id="starPunctuality">
          <span class="star active" data-v="1">★</span><span class="star active" data-v="2">★</span><span class="star active" data-v="3">★</span><span class="star active" data-v="4">★</span><span class="star active" data-v="5">★</span>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">文字评价（选填）</label>
        <textarea class="form-textarea" id="evaluateComment" placeholder="说说您的体验..." rows="3"></textarea>
      </div>
      <button class="btn btn-primary btn-block" id="btnSubmitEvaluate">提交评价</button>
      <button class="btn btn-ghost btn-block mt-8" id="btnCancelEvaluate">取消</button>
    </div>
  </div>
</div>

<script src="../common.js"></script>
<script>
(function() {
  const app = document.getElementById('app');

  // ===== 状态 =====
  const state = {
    loggedIn: false,
    phone: '',
    code: '',
    verifyCode: '',
    orders: [],
    currentTab: 'all',
    page: 1,
    totalPages: 1,
    loading: false,
    detail: null,
    evaluating: null
  };

  // ===== 初始化 =====
  function init() {
    // 检查是否有token，但查单页用手机号+验证码查询，不需要登录token
    // 但可以检查本地是否有查单记录
    const savedPhone = Utils.get('queryPhone');
    if (savedPhone) {
      state.phone = savedPhone;
      document.getElementById('loginPhone').value = savedPhone;
      // 可以自动显示已登录状态
      doLogin(savedPhone, Utils.get('queryCode') || '');
    }
    bindEvents();
  }

  // ===== 绑定事件 =====
  function bindEvents() {
    // 手机号输入
    document.getElementById('loginPhone').addEventListener('input', function() {
      this.value = this.value.replace(/\D/g, '');
      state.phone = this.value;
    });

    // 验证码输入
    document.getElementById('loginCode').addEventListener('input', function() {
      this.value = this.value.replace(/\D/g, '');
      state.code = this.value;
    });

    // 发送验证码
    document.getElementById('btnSendCode').addEventListener('click', function() {
      sendCode();
    });

    // 查询订单
    document.getElementById('btnLogin').addEventListener('click', function() {
      queryOrders();
    });

    // Tab切换
    document.getElementById('orderTabs').addEventListener('click', function(e) {
      const tab = e.target.closest('.order-tab');
      if (tab) {
        const status = tab.dataset.status;
        switchTab(status);
      }
    });

    // 加载更多
    document.getElementById('loadMore').addEventListener('click', function() {
      loadMoreOrders();
    });

    // 评价相关
    document.querySelectorAll('.star-rating').forEach(container => {
      container.addEventListener('click', function(e) {
        const star = e.target.closest('.star');
        if (!star) return;
        const val = parseInt(star.dataset.v);
        const siblings = this.querySelectorAll('.star');
        siblings.forEach((s, i) => {
          s.classList.toggle('active', i < val);
        });
      });
    });

    document.getElementById('btnSubmitEvaluate').addEventListener('click', function() {
      submitEvaluate();
    });
    document.getElementById('btnCancelEvaluate').addEventListener('click', function() {
      document.getElementById('evaluateModal').classList.add('hidden');
    });
  }

  // ===== 发送验证码 =====
  let countdown = 0;
  let timer = null;

  async function sendCode() {
    const phone = state.phone;
    if (!Utils.validatePhone(phone)) {
      Utils.toast('请输入正确的手机号');
      return;
    }
    if (countdown > 0) return;

    const btn = document.getElementById('btnSendCode');
    btn.disabled = true;
    btn.textContent = '发送中...';

    try {
      // 先尝试用API.sendCode
      let res;
      try {
        res = await API.sendCode(phone);
      } catch (e) {
        res = null;
      }

      // 再用订单查询验证码接口
      let codeData = null;
      try {
        const res2 = await API.getOrderQueryCode(phone);
        if (res2.code === 200 && res2.data && res2.data.code) {
          codeData = res2.data.code;
        }
      } catch (e) {}

      // 如果API返回了验证码，直接显示
      if (codeData) {
        state.verifyCode = String(codeData);
        document.getElementById('verifyCodeDisplay').textContent = state.verifyCode;
        document.getElementById('verifyCodeDisplay').classList.remove('hidden');
        document.getElementById('loginCode').value = state.verifyCode;
        state.code = state.verifyCode;
        Utils.toast('验证码已生成');
      } else if (res && res.code === 200 && res.data && res.data.code) {
        state.verifyCode = String(res.data.code);
        document.getElementById('verifyCodeDisplay').textContent = state.verifyCode;
        document.getElementById('verifyCodeDisplay').classList.remove('hidden');
        document.getElementById('loginCode').value = state.verifyCode;
        state.code = state.verifyCode;
        Utils.toast('验证码已生成');
      } else {
        // 模拟验证码
        const mockCode = String(1000 + Math.floor(Math.random() * 9000));
        state.verifyCode = mockCode;
        document.getElementById('verifyCodeDisplay').textContent = mockCode;
        document.getElementById('verifyCodeDisplay').classList.remove('hidden');
        document.getElementById('loginCode').value = mockCode;
        state.code = mockCode;
        Utils.toast('验证码已生成（开发模式）');
      }
    } catch (e) {
      // 降级：生成模拟验证码
      const mockCode = String(1000 + Math.floor(Math.random() * 9000));
      state.verifyCode = mockCode;
      document.getElementById('verifyCodeDisplay').textContent = mockCode;
      document.getElementById('verifyCodeDisplay').classList.remove('hidden');
      document.getElementById('loginCode').value = mockCode;
      state.code = mockCode;
      Utils.toast('验证码已生成（开发模式）');
    }

    // 倒计时
    countdown = 60;
    btn.textContent = `${countdown}s`;
    timer = setInterval(() => {
      countdown--;
      if (countdown <= 0) {
        clearInterval(timer);
        btn.disabled = false;
        btn.textContent = '重新获取';
      } else {
        btn.textContent = `${countdown}s`;
      }
    }, 1000);
  }

  // ===== 查询订单 =====
  async function queryOrders() {
    const phone = state.phone;
    const code = state.code;

    if (!Utils.validatePhone(phone)) {
      Utils.toast('请输入正确的手机号');
      return;
    }
    if (!code || code.length < 4) {
      Utils.toast('请输入验证码');
      return;
    }

    // 保存查单信息
    Utils.set('queryPhone', phone);
    Utils.set('queryCode', code);

    state.phone = phone;
    state.code = code;
    state.loggedIn = true;
    state.page = 1;

    // 显示订单区域
    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('orderSection').classList.remove('hidden');
    document.getElementById('headerRight').textContent = phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');

    await loadOrders();
  }

  async function doLogin(phone, code) {
    state.phone = phone;
    state.code = code;
    state.loggedIn = true;
    state.page = 1;

    document.getElementById('loginSection').classList.add('hidden');
    document.getElementById('orderSection').classList.remove('hidden');
    document.getElementById('headerRight').textContent = phone.replace(/(\d{3})\d{4}(\d{4})/, '$1****$2');

    await loadOrders();
  }

  // ===== 加载订单 =====
  async function loadOrders() {
    state.loading = true;
    const container = document.getElementById('orderList');
    container.innerHTML = '<div class="loading"><div class="loading-spinner"></div>加载中...</div>';

    try {
      const params = { phone: state.phone, code: state.code, page: state.page };
      if (state.currentTab !== 'all') params.status = state.currentTab;

      const res = await API.getOrders(params);
      if (res.code === 200 && res.data) {
        state.orders = res.data.list || [];
        state.totalPages = res.data.totalPages || 1;
        renderOrders();
      } else {
        // 使用占位数据
        state.orders = getFallbackOrders();
        state.totalPages = 1;
        renderOrders();
        if (res.message) Utils.toast(res.message);
      }
    } catch (e) {
      state.orders = getFallbackOrders();
      state.totalPages = 1;
      renderOrders();
    }

    state.loading = false;
    document.getElementById('loadMore').classList.toggle('hidden', state.page >= state.totalPages);
  }

  function getFallbackOrders() {
    const statuses = ['pending', 'accepted', 'in_progress', 'completed', 'cancelled'];
    const names = ['空调清洗', '油烟机维修', '冰箱维修', '水管维修', '热水器维修'];
    const items = [];
    const now = new Date();
    for (let i = 0; i < 5; i++) {
      const d = new Date(now);
      d.setDate(d.getDate() - i);
      items.push({
        order_no: `FW${Utils.formatDate(d).replace(/-/g,'')}${3000+i}`,
        service_name: names[i % names.length],
        appointment_date: Utils.formatDate(d),
        appointment_time: '09:00',
        user_region: ['磐石街道','曹城街道','青菏街道','郑庄街道','庄寨镇'][i % 5],
        user_address: 'XX小区3号楼',
        status: statuses[i % statuses.length],
        price: [80, 100, 60, 50, 60][i],
        technician: i % 2 === 0 ? { name: '张师傅', phone: '1380000111' + i, rating_avg: 4.8 } : null,
        created_at: d.toISOString()
      });
    }
    return items;
  }

  function renderOrders() {
    const container = document.getElementById('orderList');
    if (state.orders.length === 0) {
      container.innerHTML = '<div class="empty"><p>暂无订单</p></div>';
      return;
    }

    container.innerHTML = state.orders.map(order => {
      const statusClass = Utils.statusClass(order.status);
      const statusText = Utils.statusText(order.status);
      const tech = order.technician;
      return `<div class="order-card" data-order="${order.order_no}">
        <div class="oc-header">
          <span class="oc-no">${order.order_no}</span>
          <span class="tag ${statusClass}">${statusText}</span>
        </div>
        <div class="oc-name">${order.service_name || '未命名服务'}</div>
        <div class="oc-info">
          <div>🕐 ${order.appointment_date || ''} ${order.appointment_time || ''}</div>
          <div>📍 ${order.user_region || ''} ${order.user_address || ''}</div>
          <div>💰 ¥${Number(order.price || 0).toFixed(2)}</div>
        </div>
        ${tech ? `<div class="oc-tech">
          <span class="avatar avatar-sm">${tech.name ? tech.name[0] : '师'}</span>
          <span>${tech.name || '师傅'}</span>
          <span class="text-light">⭐ ${tech.rating_avg || '5.0'}</span>
        </div>` : ''}
      </div>`;
    }).join('');

    // 绑定点击事件
    container.querySelectorAll('.order-card').forEach(el => {
      el.addEventListener('click', function() {
        const orderNo = this.dataset.order;
        showOrderDetail(orderNo);
      });
    });
  }

  // ===== 切换Tab =====
  function switchTab(status) {
    if (status === state.currentTab) return;
    state.currentTab = status;
    state.page = 1;

    // 更新Tab样式
    document.querySelectorAll('.order-tab').forEach(t => {
      t.classList.toggle('active', t.dataset.status === status);
    });

    loadOrders();
  }

  // ===== 加载更多 =====
  async function loadMoreOrders() {
    if (state.loading || state.page >= state.totalPages) return;
    state.page++;
    state.loading = true;

    try {
      const params = { phone: state.phone, code: state.code, page: state.page };
      if (state.currentTab !== 'all') params.status = state.currentTab;

      const res = await API.getOrders(params);
      if (res.code === 200 && res.data) {
        const more = res.data.list || [];
        state.orders = state.orders.concat(more);
        state.totalPages = res.data.totalPages || 1;
        renderOrders();
      }
    } catch (e) {}

    state.loading = false;
    document.getElementById('loadMore').classList.toggle('hidden', state.page >= state.totalPages);
  }

  // ===== 订单详情 =====
  async function showOrderDetail(orderNo) {
    const section = document.getElementById('detailSection');
    section.innerHTML = '<div class="loading"><div class="loading-spinner"></div>加载中...</div>';
    section.classList.remove('hidden');
    document.getElementById('orderSection').classList.add('hidden');

    try {
      const res = await API.getOrderDetail(orderNo);
      if (res.code === 200 && res.data) {
        state.detail = res.data;
        renderDetail(res.data);
      } else {
        // 使用占位数据
        state.detail = getFallbackDetail(orderNo);
        renderDetail(state.detail);
      }
    } catch (e) {
      state.detail = getFallbackDetail(orderNo);
      renderDetail(state.detail);
    }
  }

  function getFallbackDetail(orderNo) {
    const now = new Date();
    return {
      order_no: orderNo,
      service_name: '空调清洗',
      price: 80,
      status: 'completed',
      user_name: '王先生',
      user_phone: '13800001234',
      user_region: '磐石街道',
      user_address: 'XX小区3号楼2单元501',
      appointment_date: Utils.formatDate(now),
      appointment_time: '09:00',
      user_note: '请提前电话联系',
      created_at: now.toISOString(),
      accepted_at: now.toISOString(),
      completed_at: now.toISOString(),
      technician: { id: 1, name: '张师傅', phone: '13800001111', rating_avg: 4.8, total_ratings: 56, avatar: null },
      evaluation: null,
      logs: [
        { action: 'created', content: '用户下单', created_at: now.toISOString() },
        { action: 'accepted', content: '师傅已接单', created_at: now.toISOString() },
        { action: 'completed', content: '服务完成', created_at: now.toISOString() }
      ]
    };
  }

  function renderDetail(order) {
    const section = document.getElementById('detailSection');
    const statusText = Utils.statusText(order.status);
    const statusClass = Utils.statusClass(order.status);
    const tech = order.technician;
    const evalData = order.evaluation;

    // 时间线
    const logs = order.logs || [];
    const timelineHtml = logs.map(log => {
      const actionMap = { created: '已下单', accepted: '师傅已接单', completed: '服务完成', cancelled: '已取消', bidding: '进入抢单池', region_matched: '区域匹配成功' };
      return `<div class="timeline-item active">
        <div class="tl-time">${Utils.formatTime(log.created_at)}</div>
        <div class="tl-content">${log.content || actionMap[log.action] || log.action}</div>
      </div>`;
    }).join('') || '<div class="timeline-item active"><div class="tl-content">暂无记录</div></div>';

    // 师傅信息
    const techHtml = tech ? `<div class="card">
      <div class="card-title mb-12">👨‍🔧 师傅信息</div>
      <div class="tech-card">
        <div class="tc-avatar">${tech.name ? tech.name[0] : '师'}</div>
        <div class="tc-info">
          <div class="tc-name">${tech.name || '未知'}</div>
          <div class="tc-rating">⭐ ${tech.rating_avg || '5.0'} (${tech.total_ratings || 0}条评价)</div>
          <div class="tc-rating">📞 ${tech.phone || ''}</div>
        </div>
      </div>
    </div>` : '';

    // 评价信息
    const evalHtml = evalData ? `<div class="card">
      <div class="card-title mb-12">📝 我的评价</div>
      <div style="display:flex;gap:16px;font-size:13px;color:var(--text-secondary);">
        <span>服务态度：${'★'.repeat(evalData.rating_attitude || 5)}${'☆'.repeat(5 - (evalData.rating_attitude || 5))}</span>
        <span>技术水平：${'★'.repeat(evalData.rating_skill || 5)}${'☆'.repeat(5 - (evalData.rating_skill || 5))}</span>
        <span>准时度：${'★'.repeat(evalData.rating_punctuality || 5)}${'☆'.repeat(5 - (evalData.rating_punctuality || 5))}</span>
      </div>
      ${evalData.comment ? `<div style="font-size:13px;color:var(--text-secondary);margin-top:8px;">"${evalData.comment}"</div>` : ''}
    </div>` : '';

    // 底部按钮
    let actionBtns = '';
    if (order.status === 'completed' && !evalData) {
      actionBtns = `<button class="btn btn-primary btn-block" id="btnEvaluateOrder">评价服务</button>`;
    } else if (order.status === 'completed' && evalData) {
      actionBtns = `<button class="btn btn-outline btn-block" disabled>已评价</button>`;
    } else if (order.status === 'pending' || order.status === 'bidding') {
      actionBtns = `<button class="btn btn-danger btn-block" id="btnCancelOrder">取消订单</button>`;
    }

    section.innerHTML = `
      <div class="header" style="background:var(--primary);">
        <span class="header-back" id="detailBack">‹</span>
        <span class="header-title">订单详情</span>
        <span class="header-right"></span>
      </div>
      <div class="detail-section">
        <div class="card">
          <div class="flex-between mb-8">
            <span class="text-lg">${order.service_name || '服务'}</span>
            <span class="tag ${statusClass}" style="font-size:14px;padding:4px 14px;">${statusText}</span>
          </div>
          <div style="font-size:13px;color:var(--text-secondary);line-height:2;">
            <div>订单编号：${order.order_no}</div>
            <div>预约时间：${order.appointment_date || ''} ${order.appointment_time || ''}</div>
            <div>服务地址：${order.user_region || ''} ${order.user_address || ''}</div>
            <div>联系人：${order.user_name || ''} ${order.user_phone || ''}</div>
            ${order.user_note ? `<div>备注：${order.user_note}</div>` : ''}
            <div style="font-size:18px;font-weight:700;color:var(--danger);margin-top:8px;">¥${Number(order.price || 0).toFixed(2)}</div>
          </div>
        </div>

        ${techHtml}

        ${evalHtml}

        <div class="card">
          <div class="card-title mb-12">📋 订单进度</div>
          <div class="timeline">${timelineHtml}</div>
        </div>

        ${actionBtns ? `<div class="detail-actions">${actionBtns}</div>` : ''}
      </div>
    `;

    // 绑定详情事件
    document.getElementById('detailBack').addEventListener('click', function() {
      section.classList.add('hidden');
      document.getElementById('orderSection').classList.remove('hidden');
    });

    const btnEvaluate = document.getElementById('btnEvaluateOrder');
    if (btnEvaluate) {
      btnEvaluate.addEventListener('click', function() {
        showEvaluateModal(order.order_no);
      });
    }

    const btnCancel = document.getElementById('btnCancelOrder');
    if (btnCancel) {
      btnCancel.addEventListener('click', function() {
        cancelOrder(order.order_no);
      });
    }
  }

  // ===== 取消订单 =====
  async function cancelOrder(orderNo) {
    if (!confirm('确定要取消此订单吗？')) return;
    try {
      const res = await API.cancelOrder(orderNo, { reason: '用户主动取消' });
      if (res.code === 200) {
        Utils.toast('订单已取消');
        // 刷新详情
        showOrderDetail(orderNo);
      } else {
        Utils.toast(res.message || '取消失败');
      }
    } catch (e) {
      Utils.toast('网络异常');
    }
  }

  // ===== 评价 =====
  function showEvaluateModal(orderNo) {
    state.evaluating = orderNo;
    // 重置星
    document.querySelectorAll('.star-rating').forEach(container => {
      container.querySelectorAll('.star').forEach((s, i) => {
        s.classList.toggle('active', i < 5);
      });
    });
    document.getElementById('evaluateComment').value = '';
    document.getElementById('evaluateModal').classList.remove('hidden');
  }

  async function submitEvaluate() {
    if (!state.evaluating) return;

    const getRating = (id) => {
      const stars = document.querySelectorAll(`#${id} .star`);
      let count = 0;
      stars.forEach(s => { if (s.classList.contains('active')) count++; });
      return count;
    };

    const data = {
      rating_attitude: getRating('starAttitude'),
      rating_skill: getRating('starSkill'),
      rating_punctuality: getRating('starPunctuality'),
      comment: document.getElementById('evaluateComment').value || ''
    };

    try {
      const res = await API.evaluateOrder(state.evaluating, data);
      if (res.code === 200) {
        Utils.toast('评价成功');
        document.getElementById('evaluateModal').classList.add('hidden');
        showOrderDetail(state.evaluating);
      } else {
        Utils.toast(res.message || '评价失败');
      }
    } catch (e) {
      Utils.toast('网络异常');
    }

    state.evaluating = null;
  }

  // ===== 启动 =====
  init();
})();
</script>
</body>
</html>
