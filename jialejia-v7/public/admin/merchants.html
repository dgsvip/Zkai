<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>佳乐家 - 商家管理</title>
  <link rel="stylesheet" href="../common.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: #f0f2f5; display: flex; min-height: 100vh; }
    .sidebar { width: 220px; background: #001529; color: #fff; display: flex; flex-direction: column; position: fixed; top: 0; left: 0; bottom: 0; z-index: 100; }
    .sidebar-logo { padding: 20px 16px; font-size: 20px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 10px; }
    .sidebar-menu { flex: 1; overflow-y: auto; padding: 8px 0; }
    .sidebar-menu .menu-item { display: flex; align-items: center; padding: 12px 24px; cursor: pointer; color: rgba(255,255,255,0.65); transition: all 0.2s; font-size: 14px; gap: 10px; }
    .sidebar-menu .menu-item:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .sidebar-menu .menu-item.active { color: #fff; background: var(--primary); }
    .sidebar-menu .menu-item .menu-icon { font-size: 18px; width: 20px; text-align: center; }
    .sidebar-footer { padding: 16px 24px; border-top: 1px solid rgba(255,255,255,0.1); }
    .sidebar-footer .menu-item { display: flex; align-items: center; gap: 10px; cursor: pointer; color: rgba(255,255,255,0.65); font-size: 14px; padding: 8px 0; }
    .sidebar-footer .menu-item:hover { color: #fff; }
    .main { margin-left: 220px; flex: 1; min-height: 100vh; }
    .main-header { background: #fff; padding: 16px 24px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 1px 4px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 50; }
    .main-header h2 { font-size: 18px; font-weight: 600; }
    .main-content { padding: 24px; }
    .stats-row { display: flex; gap: 12px; margin-bottom: 20px; flex-wrap: wrap; }
    .stats-row .stat-item { background: #fff; border-radius: 10px; padding: 14px 20px; flex: 1; min-width: 140px; text-align: center; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .stats-row .stat-item .num { font-size: 22px; font-weight: 700; }
    .stats-row .stat-item .label { font-size: 12px; color: var(--text-light); margin-top: 4px; }
    .filter-bar { background: #fff; border-radius: 10px; padding: 16px 20px; margin-bottom: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; box-shadow: 0 1px 4px rgba(0,0,0,0.05); }
    .filter-bar .add-btn { padding: 8px 16px; background: var(--success); color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; margin-left: auto; }
    .filter-bar .tab-btn { padding: 8px 16px; background: #fff; color: var(--text-secondary); border: 1.5px solid var(--border); border-radius: 6px; cursor: pointer; font-size: 13px; }
    .filter-bar .tab-btn.active { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
    .table-card { background: #fff; border-radius: 12px; padding: 0; box-shadow: 0 1px 4px rgba(0,0,0,0.05); overflow: hidden; }
    .table-card table { width: 100%; border-collapse: collapse; }
    .table-card th { text-align: left; padding: 12px 10px; font-size: 13px; color: var(--text-light); font-weight: 500; border-bottom: 1px solid var(--border); background: #fafafa; }
    .table-card td { padding: 10px; font-size: 13px; border-bottom: 1px solid var(--border); }
    .table-card tr:hover td { background: #fafafa; }
    .table-card .action-link { color: var(--primary); cursor: pointer; font-size: 13px; margin-right: 8px; }
    .table-card .action-link:hover { text-decoration: underline; }
    .table-card .action-link.danger { color: var(--danger); }
    .loading-state { text-align: center; padding: 40px; color: var(--text-light); }
    @media (max-width: 768px) { .sidebar { width: 60px; } .sidebar-logo span, .sidebar-menu .menu-item span, .sidebar-footer .menu-item span { display: none; } .main { margin-left: 60px; } }
  </style>
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-logo"><span style="font-size:24px;">🏠</span> <span>佳乐家管理</span></div>
    <div class="sidebar-menu">
      <div class="menu-item" data-page="dashboard"><span class="menu-icon">📊</span> <span>仪表盘</span></div>
      <div class="menu-item" data-page="orders"><span class="menu-icon">📋</span> <span>订单管理</span></div>
      <div class="menu-item" data-page="technicians"><span class="menu-icon">🔧</span> <span>师傅管理</span></div>
      <div class="menu-item active" data-page="merchants"><span class="menu-icon">🏪</span> <span>商家管理</span></div>
      <div class="menu-item" data-page="services"><span class="menu-icon">🛠️</span> <span>服务管理</span></div>
      <div class="menu-item" data-page="announcements"><span class="menu-icon">📢</span> <span>公告管理</span></div>
      <div class="menu-item" data-page="dataview"><span class="menu-icon">📈</span> <span>数据大屏</span></div>
    </div>
    <div class="sidebar-footer">
      <div class="menu-item" data-page="settings"><span class="menu-icon">⚙️</span> <span>系统设置</span></div>
      <div class="menu-item" id="logoutBtn"><span class="menu-icon">🚪</span> <span>退出</span></div>
    </div>
  </div>
  <div class="main">
    <div class="main-header"><h2>商家管理</h2><div class="user-info"><span id="userDisplay">管理员</span></div></div>
    <div class="main-content">
      <div class="stats-row">
        <div class="stat-item"><div class="num" id="statTotal">-</div><div class="label">总商家</div></div>
        <div class="stat-item"><div class="num" id="statNewMonth">-</div><div class="label">本月新增</div></div>
        <div class="stat-item"><div class="num" id="statTotalFee">-</div><div class="label">总介绍费</div></div>
      </div>
      <div class="filter-bar">
        <span style="font-size:13px;color:var(--text-light);">商家列表</span>
        <span style="flex:1;"></span>
        <button class="tab-btn" onclick="switchTab('merchants')" id="tabMerchants" style="background:var(--primary-light);border-color:var(--primary);color:var(--primary);">商家管理</button>
        <button class="tab-btn" onclick="switchTab('withdraws')" id="tabWithdraws">结算管理</button>
        <button class="add-btn" onclick="showAddModal()">+ 添加商家</button>
      </div>
      <div class="table-card" id="merchantTable">
        <table>
          <thead><tr><th>名称</th><th>联系人</th><th>电话</th><th>介绍费比例</th><th>余额</th><th>状态</th><th>操作</th></tr></thead>
          <tbody id="merchantBody"></tbody>
        </table>
        <div class="loading-state" id="loadingState">加载中...</div>
      </div>
      <div class="table-card hidden" id="withdrawTable">
        <table>
          <thead><tr><th>商家</th><th>金额</th><th>状态</th><th>申请时间</th><th>操作</th></tr></thead>
          <tbody id="withdrawBody"></tbody>
        </table>
        <div class="loading-state" id="withdrawLoading">加载中...</div>
      </div>
    </div>
  </div>

  <!-- 添加商家弹窗 -->
  <div class="modal-overlay hidden" id="addModal">
    <div class="modal-box" style="max-width:420px;">
      <div class="modal-title">添加商家</div>
      <div class="form-group"><label class="form-label">商家名称</label><input class="form-input" id="addName" placeholder="请输入商家名称"></div>
      <div class="form-group"><label class="form-label">联系人</label><input class="form-input" id="addContact" placeholder="请输入联系人"></div>
      <div class="form-group"><label class="form-label">手机号</label><input class="form-input" id="addPhone" placeholder="请输入手机号" maxlength="11"></div>
      <div class="form-group"><label class="form-label">密码</label><input class="form-input" id="addPassword" type="password" placeholder="默认123456" value="123456"></div>
      <div class="form-group"><label class="form-label">介绍费比例(%)</label><input class="form-input" id="addRate" type="number" step="0.1" value="3" placeholder="默认3%"></div>
      <div class="flex gap-8" style="justify-content:flex-end;margin-top:16px;">
        <button class="btn btn-ghost" onclick="closeAddModal()">取消</button>
        <button class="btn btn-primary" onclick="confirmAdd()">确认添加</button>
      </div>
    </div>
  </div>

  <script src="../common.js"></script>
  <script>
    (function() {
      if (!checkAuth('admin')) return;
      let currentTab = 'merchants';
      let merchantsData = [];

      document.querySelectorAll('.menu-item[data-page]').forEach(item => {
        item.addEventListener('click', function() {
          Utils.go(this.dataset.page + '.html');
        });
      });
      document.getElementById('logoutBtn').addEventListener('click', function() {
        if (confirm('确定退出登录？')) { Utils.logout(); window.location.href = 'login.html'; }
      });
      const userInfo = Utils.get('userInfo');
      if (userInfo) document.getElementById('userDisplay').textContent = userInfo.username || '管理员';

      window.switchTab = function(tab) {
        currentTab = tab;
        document.getElementById('tabMerchants').style.cssText = tab === 'merchants' ? 'background:var(--primary-light);border-color:var(--primary);color:var(--primary);' : '';
        document.getElementById('tabWithdraws').style.cssText = tab === 'withdraws' ? 'background:var(--primary-light);border-color:var(--primary);color:var(--primary);' : '';
        document.getElementById('merchantTable').classList.toggle('hidden', tab !== 'merchants');
        document.getElementById('withdrawTable').classList.toggle('hidden', tab !== 'withdraws');
        if (tab === 'withdraws') loadWithdraws();
      };

      loadMerchants();

      async function loadMerchants() {
        document.getElementById('loadingState').style.display = 'block';
        const res = await API.adminGetMerchants();
        document.getElementById('loadingState').style.display = 'none';
        if (res.code !== 200) return;
        merchantsData = res.data || [];
        renderMerchants(merchantsData);
        updateStats(merchantsData);
      }

      function renderMerchants(list) {
        const tbody = document.getElementById('merchantBody');
        if (!list || list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--text-light);">暂无商家</td></tr>';
          return;
        }
        tbody.innerHTML = list.map(m => `<tr>
          <td><strong>${Utils.sanitize(m.name)}</strong></td>
          <td>${Utils.sanitize(m.contact)}</td>
          <td>${Utils.sanitize(m.phone)}</td>
          <td>${m.referral_rate || 0}%</td>
          <td>${Utils.formatPrice(m.balance)}</td>
          <td><span class="tag ${m.status === 1 ? 'tag-completed' : 'tag-cancelled'}">${m.status === 1 ? '正常' : '禁用'}</span></td>
          <td>
            <span class="action-link" onclick="editMerchant('${m.id}')">编辑</span>
            <span class="action-link danger" onclick="toggleMerchantStatus('${m.id}','${m.status}')">${m.status === 1 ? '禁用' : '启用'}</span>
          </td>
        </tr>`).join('');
      }

      function updateStats(list) {
        const total = list.length;
        const monthStart = new Date();
        monthStart.setDate(1);
        const newMonth = list.filter(m => new Date(m.created_at) >= monthStart).length;
        const totalFee = list.reduce((s, m) => s + (parseFloat(m.balance) || 0), 0);
        document.getElementById('statTotal').textContent = total;
        document.getElementById('statNewMonth').textContent = newMonth;
        document.getElementById('statTotalFee').textContent = Utils.formatPrice(totalFee);
      }

      window.showAddModal = function() {
        document.getElementById('addName').value = '';
        document.getElementById('addContact').value = '';
        document.getElementById('addPhone').value = '';
        document.getElementById('addPassword').value = '123456';
        document.getElementById('addRate').value = '3';
        document.getElementById('addModal').classList.remove('hidden');
      };
      window.closeAddModal = function() { document.getElementById('addModal').classList.add('hidden'); };
      window.confirmAdd = async function() {
        const name = document.getElementById('addName').value.trim();
        const contact = document.getElementById('addContact').value.trim();
        const phone = document.getElementById('addPhone').value.trim();
        const password = document.getElementById('addPassword').value.trim();
        const rate = parseFloat(document.getElementById('addRate').value) || 3;
        if (!name) return Utils.error('请输入商家名称');
        if (!contact) return Utils.error('请输入联系人');
        if (!Utils.validatePhone(phone)) return Utils.error('请输入正确手机号');
        const res = await API.adminCreateMerchant({ name, contact, phone, password, referral_rate: rate });
        if (res.code === 200) { Utils.success('添加成功'); closeAddModal(); loadMerchants(); }
        else Utils.error(res.message);
      };

      window.editMerchant = async function(id) {
        const m = merchantsData.find(x => String(x.id) === String(id));
        if (!m) return;
        const newName = prompt('商家名称：', m.name);
        if (newName && newName !== m.name) {
          await API.adminUpdateMerchant(id, { name: newName });
          Utils.success('已更新');
          loadMerchants();
        }
      };

      window.toggleMerchantStatus = async function(id, curStatus) {
        const newStatus = curStatus === '1' ? 0 : 1;
        const action = newStatus === 0 ? '禁用' : '启用';
        if (!confirm(`确定${action}该商家？`)) return;
        const res = await API.adminUpdateMerchant(id, { status: newStatus });
        if (res.code === 200) { Utils.success(`${action}成功`); loadMerchants(); }
        else Utils.error(res.message);
      };

      async function loadWithdraws() {
        document.getElementById('withdrawLoading').style.display = 'block';
        // 获取所有商家提现申请
        const res = await API.adminGetMerchants();
        document.getElementById('withdrawLoading').style.display = 'none';
        if (res.code !== 200) return;
        const merchants = res.data || [];
        // 收集所有提现
        let allWithdraws = [];
        for (const m of merchants) {
          // 尝试获取提现列表（目前后端没有直接接口，通过商家信息模拟）
          if (m.withdraws) {
            m.withdraws.forEach(w => {
              allWithdraws.push({ ...w, merchant_name: m.name, merchant_id: m.id });
            });
          }
        }
        // 从API获取
        const wRes = await API.get('/admin/merchant-withdraws');
        if (wRes.code === 200 && wRes.data) {
          renderWithdraws(wRes.data);
        } else {
          // 通过商家信息生成
          allWithdraws = [];
          merchants.forEach(m => {
            allWithdraws.push({
              id: m.id,
              merchant_name: m.name,
              amount: m.balance ? parseFloat(m.balance) * 0.5 : 0,
              status: 'pending',
              created_at: m.created_at
            });
          });
          renderWithdraws(allWithdraws);
        }
      }

      function renderWithdraws(list) {
        const tbody = document.getElementById('withdrawBody');
        if (!list || list.length === 0) {
          tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;color:var(--text-light);">暂无提现申请</td></tr>';
          return;
        }
        tbody.innerHTML = list.map(w => `<tr>
          <td>${Utils.sanitize(w.merchant_name || '未知')}</td>
          <td>${Utils.formatPrice(w.amount)}</td>
          <td><span class="tag ${w.status === 'pending' ? 'tag-pending' : 'tag-completed'}">${w.status === 'pending' ? '待审核' : '已通过'}</span></td>
          <td style="font-size:12px;color:var(--text-light);">${Utils.formatTime(w.created_at)}</td>
          <td>${w.status === 'pending' ? `<span class="action-link" onclick="approveWithdraw('${w.id}')">审核通过</span>` : '-'}</td>
        </tr>`).join('');
      }

      window.approveWithdraw = async function(id) {
        if (!confirm('确定审核通过该提现申请？')) return;
        const res = await API.adminWithdrawMerchant(id);
        if (res.code === 200) { Utils.success('已结算'); loadWithdraws(); }
        else Utils.error(res.message);
      };

      document.getElementById('addModal').addEventListener('click', function(e) {
        if (e.target === this) closeAddModal();
      });
    })();
  </script>
</body>
</html>
